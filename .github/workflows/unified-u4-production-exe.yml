name: CWS Unified U4 Production Workflow + Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [feature/unified-u4-production-workflow-exe]
  pull_request:
    branches: [feature/unified-u3-central-ui]

permissions:
  contents: read

jobs:
  u4-production-exe:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
      CWS_REQUIRE_VIEWER_GUI: '1'
      CWS_REQUIRE_IFCOPENSHELL: '1'
      M18_BLOB_SHA: 0acef19f119bbe19540e19f8e82fb9ac5c97f638
      M18_RUNTIME_SHA256: 62c1a043a63dd0628769ad0e10d68afdf890406ca6f001cf354c2d6e84b94ae1

    steps:
      - uses: actions/checkout@v6

      - name: Restore checksum-exact frozen M18 authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build\authority_evidence | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/git/blobs/$env:M18_BLOB_SHA"
          $payload = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          if ($payload.encoding -ne 'base64') { throw "Unexpected M18 encoding: $($payload.encoding)" }
          $runtime = [Convert]::FromBase64String(([string]$payload.content -replace '\s',''))
          $target = 'cws_convertor/manufacturing/m18_authority_runtime.zip'
          [IO.File]::WriteAllBytes((Join-Path $PWD $target), $runtime)
          $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($actual -ne $env:M18_RUNTIME_SHA256) { throw "M18 SHA mismatch: expected=$env:M18_RUNTIME_SHA256 actual=$actual" }
          python -c "import zipfile; p=r'cws_convertor/manufacturing/m18_authority_runtime.zip'; z=zipfile.ZipFile(p); assert z.testzip() is None; assert 'cws_m18_authority/__init__.py' in z.namelist(); print('M18 ZIP OK',len(z.namelist()))"
          [IO.File]::WriteAllText('build/authority_evidence/m18_authority_runtime.b64',[Convert]::ToBase64String($runtime),[Text.Encoding]::ASCII)
          @{schema='cws-m18-authority-evidence-1.0';source_blob=$env:M18_BLOB_SHA;runtime_sha256=$actual;runtime_bytes=$runtime.Length} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM build\authority_evidence\m18_authority_runtime.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install locked native stack
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock.txt
          python -m pip check
          python -c "import cadquery,OCP,ifcopenshell,PySide6,vtk,fitz; print('native imports OK')"

      - name: Compile source
        shell: pwsh
        run: |
          python -m compileall -q cws_convertor cws_viewer CWS_Convertor_App.py cli.py tests
          if ($LASTEXITCODE -ne 0) { throw 'compile failed' }

      - name: U0-U2 canonical gates
        shell: pwsh
        run: |
          python -c "from cws_convertor.manufacturing.authority import M18_RUNTIME_SHA256,verify_m18_runtime_archive; assert verify_m18_runtime_archive()==M18_RUNTIME_SHA256"
          python validation/unified/validate_u0_baseline.py
          python tests/unified_project_schema_u1_smoke.py
          python tests/unified_manufacturing_scribing_u2_smoke.py

      - name: Viewer V15 T3-T8 gates
        shell: pwsh
        run: |
          $tests=@('tests/viewer_v15_workspace_contract_smoke.py','tests/viewer_v15_navigation_contract_smoke.py','tests/viewer_v15_interaction_foundation_smoke.py','tests/viewer_v15_selection_pivot_parity_smoke.py','tests/viewer_v15_trimble_input_contract_smoke.py','tests/viewer_v15_feel_fix_smoke.py','tests/viewer_v15_trimble_feel_v2_smoke.py','tests/viewer_v15_selection_measurement_smoke.py','tests/viewer_v15_review_workspace_smoke.py','tests/viewer_v15_coordination_smoke.py','tests/viewer_v15_export_center_smoke.py','tests/manufacturing_face_core_smoke.py')
          foreach($test in $tests){if(!(Test-Path $test)){throw "missing gate: $test"};python $test;if($LASTEXITCODE -ne 0){throw "failed gate: $test"}}

      - name: U3-U4 integrated Viewer and workflow gates
        shell: pwsh
        run: |
          $tests=@('tests/unified_ui_context_u3_smoke.py','tests/unified_ui_shell_u3_gui_smoke.py','tests/unified_viewer_v15_u3_smoke.py','tests/unified_production_workflow_u4_smoke.py','tests/unified_u4_gui_smoke.py')
          foreach($test in $tests){python $test;if($LASTEXITCODE -ne 0){throw "failed gate: $test"}}

      - name: Source launcher gates
        shell: pwsh
        run: |
          python CWS_Convertor_App.py --create-smoke-project build\u4-smoke.cwscproj --report build\create-project.json
          python CWS_Convertor_App.py --quick-self-test --project build\u4-smoke.cwscproj --require-gui-runtime --report build\u4-source-selftest.json
          python CWS_Convertor_App.py --gui-smoke --project build\u4-smoke.cwscproj --report build\u4-source-gui-smoke.json

      - name: Build Windows distribution
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CWS_Convertor.spec
          if(!(Test-Path dist\CWS_Convertor\CWS_Convertor.exe)){throw 'GUI EXE missing'}
          if(!(Test-Path dist\CWS_Convertor\CWS_Convertor_CLI.exe)){throw 'CLI EXE missing'}
          $runtime='dist\CWS_Convertor\_internal\cws_convertor\manufacturing\m18_authority_runtime.zip'
          if(!(Test-Path $runtime)){throw 'packaged M18 runtime missing'}
          if((Get-FileHash -Algorithm SHA256 $runtime).Hash.ToLowerInvariant() -ne $env:M18_RUNTIME_SHA256){throw 'packaged M18 SHA mismatch'}

      - name: Packaged runtime gates
        shell: pwsh
        run: |
          dist\CWS_Convertor\CWS_Convertor.exe --quick-self-test --project build\u4-smoke.cwscproj --require-gui-runtime --report build\u4-packaged-selftest.json
          dist\CWS_Convertor\CWS_Convertor.exe --gui-smoke --project build\u4-smoke.cwscproj --report build\u4-packaged-gui-smoke.json

      - name: Build portable and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release|Out-Null
          Compress-Archive -Path dist\CWS_Convertor\* -DestinationPath release\CWS_Convertor_U4_Windows_x64_Portable.zip -CompressionLevel Optimal
          Copy-Item dist\CWS_Convertor\CWS_Convertor.exe release\CWS_Convertor_U4.exe
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe';if(!(Test-Path $iscc)){throw 'Inno Setup missing'}
          & $iscc installer\CWS_Convertor.iss;if($LASTEXITCODE -ne 0){throw 'installer build failed'}
          $setup=Get-ChildItem dist_installer\*.exe|Select-Object -First 1;if(!$setup){throw 'Setup EXE missing'}
          Copy-Item $setup.FullName release\CWS_Convertor_U4_Setup_Windows_x64.exe

      - name: Installed runtime gate
        shell: pwsh
        run: |
          $installDir="$env:RUNNER_TEMP\CWS-U4-Installed";$installer=(Resolve-Path release\CWS_Convertor_U4_Setup_Windows_x64.exe)
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$installDir") -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'installer failed'}
          & "$installDir\CWS_Convertor.exe" --quick-self-test --project build\u4-smoke.cwscproj --report build\u4-installed-selftest.json
          if($LASTEXITCODE -ne 0){throw 'installed self-test failed'}

      - name: Checksums and evidence
        shell: pwsh
        run: |
          Get-ChildItem release\*|ForEach-Object{$h=Get-FileHash $_.FullName -Algorithm SHA256;"$($h.Hash.ToLower())  $($_.Name)"}|Out-File release\SHA256SUMS.txt -Encoding ascii
          Copy-Item build\u4-*.json release\ -ErrorAction SilentlyContinue
          Copy-Item build\authority_evidence\* release\

      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_U4_Windows_x64
          path: release/*
          if-no-files-found: error
          retention-days: 30