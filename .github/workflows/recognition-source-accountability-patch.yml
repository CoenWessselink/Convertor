name: Recognition guarded source-accountability patch

on:
  push:
    branches: [agent/cws-recognition-native-integration-20260913]
    paths: [.github/workflows/recognition-source-accountability-patch.yml]

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            PyMuPDF==1.26.7 \
            pypdf==5.9.0 \
            reportlab==4.4.9 \
            XlsxWriter==3.2.9 \
            cadquery==2.8.0
      - name: Assemble and apply exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/patches/source-accountability.part00.patch \
            tools/patches/source-accountability.part01.patch \
            tools/patches/source-accountability.part02.patch \
            tools/patches/source-accountability.part03.patch \
            tools/patches/source-accountability.part04.patch \
            > /tmp/source-accountability.patch
          echo '48adb8d227226ae35483a6644a45d641f7ad71e6049961e7a2effd16a97060ce  /tmp/source-accountability.patch' | sha256sum -c -
          git apply --check /tmp/source-accountability.patch
          git apply /tmp/source-accountability.patch
          git diff --check
          python -m py_compile cws_convertor/bom/engine.py tools/check_material_reference_corpus.py tools/run_material_model_recognition_acceptance.py tests/bom_source_accountability_smoke.py
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.bom_source_accountability_smoke \
            tests.project_bom_smoke \
            tests.bom_material_integration_smoke \
            tests.bom_production_hub_complete_smoke \
            tests.bom_undo_refresh_smoke -v
      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CWS Recognition CI'
          git config user.email 'actions@users.noreply.github.com'
          git add cws_convertor/bom/engine.py tools/check_material_reference_corpus.py tools/run_material_model_recognition_acceptance.py tests/bom_source_accountability_smoke.py
          git diff --cached --check
          git commit -m 'fix(bom): make source occurrence accountability explicit'
          git push origin HEAD:agent/cws-recognition-native-integration-20260913
