name: Prepare reviewed exact export preview repair
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-export-preview-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),chunks=[];
            for(const sha of ['dbec8bce2502b40edaef6a506b52f972d03c9d38','2c78b6f855315e99fc7144d95d43fd0779156a46']){
              const b=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              const d=Buffer.from(b.content.replace(/\s/g,''),'base64');
              if(crypto.createHash('sha1').update(Buffer.from('blob '+d.length+'\0')).update(d).digest('hex')!==sha)throw new Error('Transport mismatch');
              chunks.push(d);
            }
            const data=Buffer.concat(chunks);
            if(data.length!==5752||crypto.createHash('sha256').update(data).digest('hex')!=='55d21e589582b4ff8fc04bed57dd9383f285cff9f974648c0e4c1f79e58e275c')throw new Error('Patch mismatch');
            fs.writeFileSync('/tmp/export-preview.patch.xz',data);
      - name: Verify exact baseline, patch and reviewed sources
        shell: python
        run: |
          import hashlib,json,lzma,pathlib,py_compile,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='d70f2f61dcaf178b52f4373ca92ba1dbfdf24392','Branch moved; review required'
          patch=lzma.decompress(pathlib.Path('/tmp/export-preview.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='a71bad1044eba22dbdf0b680d221b1254b23df3b2c551363b6262faa3aa12325'
          p=pathlib.Path('/tmp/export-preview.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          expected={
            'cws_convertor/project/roundtrip.py':'6fd6151ed0c45a96a23a2af409e3645a8f4c3973521b4529fbba128b306e3209',
            'docs/BOM_EXPORT_GAP_REPAIR_20260911.md':'08fb17c774450484abaef7b68bfcb4cd7ab82b7b8cf5c083dc95de47e13680d1',
            'pdf_support.py':'187efa3d1cd9558a89bed3b8c9422ebc91441898ac0ceacd2f1272bcd207d27c',
            'tests/pdf_export_brep_preview_smoke.py':'23ffbf660f7f25b55c04e931433e72ef4bf3959238d37124881905cfa3612c59'
          }
          for name,digest in expected.items():
            p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
            if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/export-preview-files.json').write_text(json.dumps(expected))
      - name: Store reviewed blobs for explicit connected commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/export-preview-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data,tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const d=fs.readFileSync(path);if(crypto.createHash('sha256').update(d).digest('hex')!==hash)throw new Error(path);
              const b=(await github.rest.git.createBlob({...repo,content:d.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:b.sha});
            }
            tree.push({path:'.github/workflows/prepare-export-preview-repair.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'cdeec89232dc2f68ca2e65368faf6da7b24d83c8',tree,files:expected,branch_updated:false,release_tests_passed:false};
            fs.mkdirSync('prepared',{recursive:true});fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Export_Preview_Reviewed_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
