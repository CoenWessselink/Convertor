name: CWS completion gap Windows gate

on:
  push:
    branches: [agent/cws-completion-gap-20260911]
    paths:
      - 'cws_convertor/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/completion-gap-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completion-gap-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}
  QT_QPA_PLATFORM: offscreen
  CWS_HEADLESS_GUI_SMOKE: '1'
  GALLIUM_DRIVER: llvmpipe
  LIBGL_ALWAYS_SOFTWARE: '1'

jobs:
  focused:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Install locked runtime
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/restore_m18_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '23.3.3'
          build-type: 'release-msvc'
          deployment-choice: '1'
      - name: W03 W18 completion dispatcher
        run: python tests/bom_completion_dispatch_smoke.py
      - name: Existing BOM production hub regressions
        shell: python
        run: |
          import pathlib, subprocess, sys
          names = [
              'bom_action_dispatch_smoke.py',
              'bom_action_execution_smoke.py',
              'bom_production_hub_smoke.py',
              'bom_review_actions_smoke.py',
              'bom_review_export_smoke.py',
              'review_workflow_smoke.py',
              'pdf_review_smoke.py',
              'pdf_export_brep_preview_smoke.py',
          ]
          for name in names:
              path = pathlib.Path('tests') / name
              if path.is_file():
                  subprocess.run([sys.executable, str(path)], check=True)
      - name: Record exact-source gate
        shell: python
        run: |
          import json, os, pathlib
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/completion-gap-gate.json').write_text(json.dumps({
              'status':'PASS','source_commit':os.environ['GITHUB_SHA'],
              'scope':'focused W03/W18 dispatcher plus existing BOM/PDF regression set'
          }, indent=2), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Completion_Gap_${{ github.sha }}
          path: build/completion-gap-gate.json
          retention-days: 30
