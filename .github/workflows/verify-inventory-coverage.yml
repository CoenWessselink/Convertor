name: Verify complete runtime control inventory
on:
  push:
    branches: [agent/cws-recognition-bom-recovery-20260908]
    paths: ['.github/workflows/verify-inventory-coverage.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - run: python -m pip install -r requirements-runtime.lock.txt
      - name: Restore checksum-bound native authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_m18_authority.py
      - name: Exercise all controls with the extended test driver
        shell: python
        run: |
          import base64,hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          out=root/'build/control-inventory-repair'
          out.mkdir(parents=True,exist_ok=True)
          name='tools/run_full_product_acceptance.py'
          data=subprocess.check_output(['git','show','HEAD:'+name])
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if sha(data)!='acd61d197fde9778f1808bf5d50deb07c068b904':
              raise RuntimeError('Test driver changed')
          old='    safe_method_errors: list[str] = []\n'
          methods=['start_selected_step_recognition','cancel_selected_step_recognition','accept_material_candidate','reject_material_candidate','preview_bulk_material','apply_bulk_material','undo_bulk_material']
          new='    safe_method_arguments.update({\n'+''.join('        "cws_convertor.ui_qt.functional_workspaces.EditWorkspacePanel.'+m+'": (),\n' for m in methods)+'        "cws_convertor.ui_qt.product_workspaces.ProductionWorkflowPanel.refresh": (),\n    })\n'+old
          text=data.decode('utf-8')
          if text.count(old)!=1: raise RuntimeError('Ambiguous test driver change')
          data=text.replace(old,new).encode('utf-8')
          if sha(data)!='545f5097c173d024285657762053a7d4a890952f':
              raise RuntimeError('Output differs from reviewed source')
          (root/name).write_bytes(data)
          result=subprocess.run([sys.executable,'tests/full_product_runtime_inventory_smoke.py'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=180)
          (out/'inventory.log').write_text(result.stdout+'\n'+result.stderr,encoding='utf-8')
          print(result.stdout)
          if result.returncode: raise RuntimeError('Uncovered or failing controls remain')
          report=json.loads(result.stdout)
          if report['status']!='PASS' or report['uncovered_required'] or report['safe_method_errors']:
              raise RuntimeError('Control inventory incomplete')
          (out/'CONTROL_INVENTORY.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          # The installed application input is identical to fdd54210: only this
          # external acceptance driver and the preparation workflow may differ.
          differences=subprocess.check_output(['git','diff','--name-only','fdd5421056e2046e8c24a7f076eab7ad6e945977'],text=True).splitlines()
          if set(differences)-{name,'.github/workflows/verify-inventory-coverage.yml'}:
              raise RuntimeError('Application source differs from installer input: '+str(differences))
          prepared={'parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                    'path':name,'sha':sha(data),'content':base64.b64encode(data).decode('ascii'),
                    'application_source_commit':'fdd5421056e2046e8c24a7f076eab7ad6e945977',
                    'only_validation_driver_changed':True,'differences':differences}
          (out/'PREPARED.json').write_text(json.dumps(prepared),encoding='utf-8')
      - name: Store tested validation driver without changing refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync('build/control-inventory-repair/PREPARED.json','utf8'));
            const result=await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,content:data.content,encoding:'base64'});
            if(result.data.sha!==data.sha) throw new Error('Blob mismatch');
            delete data.content;
            fs.writeFileSync('build/control-inventory-repair/VERIFIED.json',JSON.stringify(data,null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Control_Inventory_Repair_${{ github.sha }}
          path: |
            build/control-inventory-repair/*.log
            build/control-inventory-repair/CONTROL_INVENTORY.json
            build/control-inventory-repair/VERIFIED.json
          if-no-files-found: error
          retention-days: 30
