name: Prepare reviewed original V3 specification repair
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-original-spec-atomic-patch.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve exact reviewed patch transport
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const ids=['4fac0be880f1b06db44e3c82a3c9fcf4c88259ca','f7b2ed3a4c0ae1e1fc692693304a18bf058ef9b0','3c8128968461dbf7de200291dd9de7796d743faa','6785b76c6df9d99113a0c38cad9fd32c552f9b35','f756370b1c2cfe25cd2e378d77f0045dd83b59f2','fcb93cc27aeba00483a2438a862ec68d4a44a9a2','1d666567bee82ce39d7f974ea4fda072b9282e25','b1c68071513f97bfcd34763750d2b3cfa305e733','4f4e71a7614996dbcdbc1152620a17390bb2546e','d5bae788d57a2a4d9ce493152e73ef14ae594313','fd2755cbb05055679755f9d5be6fc63ccb4b26ac','ab76902e84d6eb2833456b6d40a1ced557aba3cb','3cd7a794064d4486d8ae3012b5b327d2efe27774','14e7e5d472331b4dc28b65cb66f94d72758549dc'];
            const chunks=[];
            for(const sha of ids){
              const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              const data=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              const hash=crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');
              if(hash!==sha)throw new Error('Transport blob mismatch '+sha);
              chunks.push(data);
            }
            const data=Buffer.concat(chunks);
            if(data.length!==26608||crypto.createHash('sha256').update(data).digest('hex')!=='3cd8281c5a5bab27e7c28761a2f37252ef75d533b717aa093ae06cfbe852bedb')throw new Error('Compressed patch mismatch');
            fs.writeFileSync('/tmp/v3-original.patch.gz',data);
      - name: Verify baseline and all reviewed source files
        shell: python
        run: |
          import gzip,hashlib,json,pathlib,py_compile,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='abe29e0447b8bed034711eddf7cf2bffdaa74e7a','Branch moved; re-review required'
          patch=gzip.decompress(pathlib.Path('/tmp/v3-original.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='8c751cb07b1c3392968ed55599641326036c45bda00c1001f30e219f940f8106'
          path=pathlib.Path('/tmp/v3-original.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected={
            '.github/workflows/installer-delivery.yml':'c5f5113f5368857f77b5076422c0430944519200171526214e27a16eaa9b0816',
            'cws_convertor/drawings/linter.py':'ca9988ae1b1a4869891b8f613667ea553a7a51768cb57510e96c3ae605db2d21',
            'cws_convertor/ui_qt/drawing_workspace_layout.py':'a1f14aafd8bf44b0e555a84907d4b74f46f4baf9041170f539755f9d5988b29a',
            'cws_convertor/ui_qt/engineering_drawing.py':'381c821dc7eae817481ac389e8fc55595337f2d63ac5d55b9f8d79cc85f18b0e',
            'cws_convertor/ui_qt/functional_workspaces.py':'ec1baf5e0bd1cebb354f762199bcbe8e8a99bb4a843c100b97e9167ebcd2fd79',
            'cws_convertor/ui_qt/pdf_ui_v3_evidence.py':'15f1a37cd8147e6c2c8ae743366927555f916bf85e9807056f6cd3f3ac1d151a',
            'docs/PDF_UI_V3_NATIVE_INTEGRATION.md':'db3facb792e45b16ec1db691af7bef12999967b35eda83e40b0728ef5890942a',
            'docs/PDF_UI_V3_QUICK_GUIDE.md':'6915dc885808875720bdb00e4e50cfbf59010e14284dbb62d6206e24a592c2c1',
            'docs/PDF_UI_V3_RESUME_20260911.md':'51016e5e98d45c9bb678fe422667c5bf63959c34127b43a0de5bd3be02fd902c',
            'docs/PDF_UI_V3_SPEC_REVIEW_20260911.md':'6b73515b970386616f37ff90fbbd97c5a49d625f4a0f51e1b29fd100db7f6017',
            'docs/pdf_ui_v3_original/CODEX_INTEGRATIEPROMPT_PDF_UI_V3.md':'58d083869b7038d970d79a5563680409625b777644ecb0a242eb0be51d021273',
            'docs/pdf_ui_v3_original/INPUT_REVIEW.json':'c0ce4b7bf0aa462c62c7dcb26deb14c2475c7dcccd26161e439a90d3e585f903',
            'docs/pdf_ui_v3_original/MANIFEST.json':'cc9b0a0579efee70312d93c542dc0779d302bca110f15a5aeed9beafa10608d2',
            'docs/pdf_ui_v3_original/README.md':'9ec12bd3a1798e05f89c4e88ecee111f72a5acea7c173bd4931f70ea983b1401',
            'docs/pdf_ui_v3_original/REFERENCE_IMAGES.md':'86493aaac5fbf3eea73bfcec37b597e276638cc153ecb61408798b903d5ba9a8',
            'tests/drawing_canonical_chain_binding_smoke.py':'2605d96b86fa50f08ecbbf496d45a187e42f0d20b1fee2f2e3c74e73203b1f44',
            'tests/drawing_v3_release_evidence_smoke.py':'8bb2980f8781a298a6747376103cdc36901449f4208f0912b1dfac2a2c3aa50d',
            'tests/ui_v3_delivery_paths_smoke.py':'f82928ec8b9081ee60329eb8b631e8771041683e86a6de62d7b2d129566ec7a7',
            'tests/ui_v3_original_input_smoke.py':'42c8fab142b5c010625dd5bd67ee43a751fe4051ec7f46be765ac31c496308c8',
            'tools/finalize_ui_v3_delivery.py':'9c2206f94b6508700504613a9f5ff59e1862fdd4052b4b31a9884766ebdd2947',
            'tools/verify_original_pdf_ui_spec.py':'b8b4e816f0194083b110673fcdcc70101c3bba8031b039731dab89e04670b37d'
          }
          for name,digest in expected.items():
              p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
              if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/v3-original-files.json').write_text(json.dumps(expected))
      - name: Prepare atomic commit without updating any branch ref
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');const repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/v3-original-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data;
            const tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const data=fs.readFileSync(path);
              if(crypto.createHash('sha256').update(data).digest('hex')!==hash)throw new Error(path);
              const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            tree.push({path:'.github/workflows/v3-original-spec-atomic-patch.yml',mode:'100644',type:'blob',sha:null});
            const createdTree=(await github.rest.git.createTree({...repo,base_tree:parent.tree.sha,tree})).data;
            if(createdTree.sha!=='f05e7850a8e8c9d0ce0469f44cebea4285850a58')throw new Error('Final source tree differs from reviewed local tree');
            const commit=(await github.rest.git.createCommit({...repo,message:'fix(ui-v3): verify original specification, revalidate release evidence and bind canonical dimension chains',tree:createdTree.sha,parents:[context.sha]})).data;
            fs.mkdirSync('prepared',{recursive:true});
            fs.writeFileSync('prepared/COMMIT.json',JSON.stringify({source_commit:commit.sha,source_tree:createdTree.sha,parent:context.sha,baseline:'abe29e0447b8bed034711eddf7cf2bffdaa74e7a',files:expected,branch_updated:false,release_tests_passed:false,scope:'Reviewed patch hashes and syntax verified; new full Windows acceptance required on this exact commit'},null,2));
            console.log('Prepared '+commit.sha+'; no branch ref moved');
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Original_Review_Commit
          path: prepared/COMMIT.json
          if-no-files-found: error
          retention-days: 30
