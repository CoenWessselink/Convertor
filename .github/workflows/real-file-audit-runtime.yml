name: Prepare private file audit runtime
on:
  push:
    branches: [agent/cws-real-file-repair-20260909]
    paths: ['.github/workflows/real-file-audit-runtime.yml']
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned native wheels for isolated local verification
        run: python -m pip download --only-binary=:all: --dest wheels ifcopenshell==0.8.5 PySide6==6.9.2
      - name: Fingerprint package transport
        run: sha256sum wheels/* > wheels/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Private_Audit_Runtime_Linux_cp313
          path: wheels/*
          if-no-files-found: error
          retention-days: 2
