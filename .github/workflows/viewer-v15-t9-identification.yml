name: CWS Viewer V15 T9 M4 identification gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_convertor/manufacturing/identification.py'
      - 'cws_convertor/manufacturing/identification_model.py'
      - 'cws_convertor/manufacturing/__init__.py'
      - 'tests/viewer_v15_identification_smoke.py'
      - '.github/workflows/viewer-v15-t9-identification.yml'

permissions:
  contents: read

jobs:
  m4-identification-contract:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile M4 modules
        shell: pwsh
        run: |
          python -m compileall -q cws_convertor/manufacturing/identification_model.py cws_convertor/manufacturing/identification.py tests/viewer_v15_identification_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M4 compileall failed' }

      - name: Run M3 no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_marking_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M3 scribing regression failed' }

      - name: Run deterministic M4 identification contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation\viewer-v15-t9-m4 | Out-Null
          python tests/viewer_v15_identification_smoke.py 2>&1 | Tee-Object validation\viewer-v15-t9-m4\m4_identification.txt
          if ($LASTEXITCODE -ne 0) { throw 'M4 identification contract failed' }

      - name: Upload M4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_V15_M4_identification_diagnostics
          path: validation/viewer-v15-t9-m4/*
          if-no-files-found: warn
          retention-days: 14
