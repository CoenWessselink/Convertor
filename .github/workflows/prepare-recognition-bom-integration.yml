name: Prepare reviewed recognition BOM integration tree

on:
  workflow_dispatch:
  push:
    branches: [agent/cws-recognition-bom-recovery-20260908]
    paths:
      - 'tools/prepare_recognition_bom_integration.py'
      - 'tools/recognition_bom_integration.patch'
      - '.github/workflows/prepare-recognition-bom-integration.yml'

permissions:
  contents: write

concurrency:
  group: prepare-recognition-bom-integration
  cancel-in-progress: false

jobs:
  prepare-tree:
    if: github.ref == 'refs/heads/agent/cws-recognition-bom-recovery-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce and hash-check the reviewed integration
        run: python tools/prepare_recognition_bom_integration.py
      - name: Store verified Git objects only; never update refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prepared = JSON.parse(fs.readFileSync('build/recognition_bom_import/PREPARED_TREE.json', 'utf8'));
            if (prepared.parent !== context.sha) throw new Error('Parent changed');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            for (const blob of prepared.blobs) {
              const response = await github.rest.git.createBlob({...repo, content: blob.content, encoding: 'base64'});
              if (response.data.sha !== blob.sha) throw new Error('Uploaded blob identity mismatch');
            }
            const response = await github.rest.git.createTree({...repo, base_tree: prepared.base_tree, tree: prepared.entries});
            if (response.data.truncated) throw new Error('Truncated tree response');
            const result = {...prepared, tree_sha: response.data.sha, run_id: context.runId};
            delete result.blobs;
            fs.writeFileSync('build/recognition_bom_import/TREE_RESULT.json', JSON.stringify(result, null, 2));
            core.info(JSON.stringify({parent: result.parent, tree: result.tree_sha, verified_paths: result.entries.length}));
      - name: Upload immutable integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Reviewed_Integration_Tree_${{ github.sha }}
          path: build/recognition_bom_import/TREE_RESULT.json
          if-no-files-found: error
          retention-days: 7
