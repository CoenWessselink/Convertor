name: Commit verified native V3 completion and rebuild exact-source delivery
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-complete-native-delivery.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Retrieve exact scoped source patch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),chunks=[];
            for(const sha of ['5bcf179610008be4e54e470a877df1501d225198','8c301ae5652c5995a11fa3482ca89c1a39b7aa94','523e09e6d7f37ce8031a73ffd1f276e311cf8fdf','9f1f5a01995135c3dac3d886bfa0ed9d90220be9']) {
              const b=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              chunks.push(Buffer.from(b.content.replace(/\s/g,''),'base64'));
            }
            fs.writeFileSync('native-completion.xz',Buffer.concat(chunks));
      - name: Verify and commit existing-application source only
        shell: python
        run: |
          import hashlib,lzma,os,pathlib,subprocess
          payload=pathlib.Path('native-completion.xz').read_bytes()
          assert hashlib.sha256(payload).hexdigest()=='7b0701f216bedfa7fd24f42791decc3f0f63f3f6c77ee0b3bf3c242e7d978d76','Patch transport hash'
          patch=lzma.decompress(payload)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==15 and all(p.startswith(('cws_convertor/','tools/','tests/','docs/')) for p in paths),paths
          for p in paths:
              if p.endswith('.py'):compile(pathlib.Path(p).read_bytes(),p,'exec')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(ui-v3): integrate original specification with real main-window, five-DPI and packaged second-process acceptance'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/cws-pdf-ui-v3-complete-20260909'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FINAL_SOURCE_SHA='+sha+'\n')
          print('FINAL_SOURCE_SHA='+sha)
      - name: Start existing installer workflow on exact final commit
        uses: actions/github-script@v7
        with:
          script: |
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const branch='agent/cws-pdf-ui-v3-complete-20260909';
            const ref=(await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data;
            if(ref.object.sha!==process.env.FINAL_SOURCE_SHA)throw new Error('Source changed before dispatch');
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'installer-delivery.yml',ref:branch});
      - name: Preserve exact clean source and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/final-source
          git archive --format=zip --output=build/final-source/source.zip HEAD
          git bundle create build/final-source/source.bundle HEAD
          git rev-parse HEAD > build/final-source/COMMIT.txt
          git rev-parse HEAD^{tree} > build/final-source/TREE.txt
          sha256sum build/final-source/source.zip build/final-source/source.bundle > build/final-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Native_Final_Source_${{ env.FINAL_SOURCE_SHA }}
          path: build/final-source/*
          retention-days: 30
          if-no-files-found: error
