name: U4 exact M18 artifact bootstrap

on:
  push:
    branches:
      - agent/u4-exact-m18-bootstrap
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  bootstrap-exact-m18-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap branch with history
        uses: actions/checkout@v6
        with:
          ref: agent/u4-exact-m18-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether exact frozen runtime is already present
        id: existing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          target = Path('cws_convertor/manufacturing/m18_authority_runtime.zip')
          expected = '62c1a043a63dd0628769ad0e10d68afdf890406ca6f001cf354c2d6e84b94ae1'
          exact = target.is_file() and len(target.read_bytes()) == 233402 and hashlib.sha256(target.read_bytes()).hexdigest() == expected
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'exact={str(exact).lower()}\n')
          print({'exact_runtime_already_present': exact})
          PY

      - name: Download existing U2/M18 workflow artifacts
        if: steps.existing.outputs.exact != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p artifact-downloads
          ids=(
            9298188626
            9298058167
            9298045719
            9297895999
            9297879053
            9297848067
            9342933585
            9325504318
          )
          for id in "${ids[@]}"; do
            echo "Downloading artifact $id"
            if gh api --method GET -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              > "artifact-downloads/${id}.zip"; then
              test -s "artifact-downloads/${id}.zip" || rm -f "artifact-downloads/${id}.zip"
            else
              echo "Artifact $id unavailable or expired; continuing"
              rm -f "artifact-downloads/${id}.zip"
            fi
          done
          ls -lh artifact-downloads || true

      - name: Recover checksum-exact frozen runtime
        if: steps.existing.outputs.exact != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/m18-artifact-bootstrap
          mkdir -p build/m18-artifact-bootstrap
          python tools/recovery/bootstrap_exact_m18_from_artifacts.py \
            build/m18-artifact-bootstrap artifact-downloads
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          source = Path('build/m18-artifact-bootstrap/m18_authority_runtime.zip')
          raw = source.read_bytes()
          assert len(raw) == 233402, len(raw)
          assert hashlib.sha256(raw).hexdigest() == '62c1a043a63dd0628769ad0e10d68afdf890406ca6f001cf354c2d6e84b94ae1'
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              assert 'cws_m18_authority/__init__.py' in archive.namelist()
              assert 'cws_m18_authority/deployment_assurance.py' in archive.namelist()
          target = Path('cws_convertor/manufacturing/m18_authority_runtime.zip')
          target.write_bytes(raw)
          report = Path('build/m18-artifact-bootstrap/M18_ARTIFACT_BOOTSTRAP_REPORT.json')
          validation = Path('validation/unified/M18_ARTIFACT_BOOTSTRAP_REPORT.json')
          validation.parent.mkdir(parents=True, exist_ok=True)
          validation.write_bytes(report.read_bytes())
          print('EXACT M18 RUNTIME READY', len(raw), hashlib.sha256(raw).hexdigest())
          PY

      - name: Commit exact runtime to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CWS Unified Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cws_convertor/manufacturing/m18_authority_runtime.zip
          if test -f validation/unified/M18_ARTIFACT_BOOTSTRAP_REPORT.json; then
            git add validation/unified/M18_ARTIFACT_BOOTSTRAP_REPORT.json
          fi
          if git diff --cached --quiet; then
            echo 'Exact runtime already committed; no source mutation needed.'
          else
            git commit -m 'fix(unified): restore checksum-exact frozen M18 runtime'
            git push origin HEAD:agent/u4-exact-m18-bootstrap
          fi

      - name: Final fail-closed runtime verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          path = Path('cws_convertor/manufacturing/m18_authority_runtime.zip')
          raw = path.read_bytes()
          expected = '62c1a043a63dd0628769ad0e10d68afdf890406ca6f001cf354c2d6e84b94ae1'
          assert len(raw) == 233402, len(raw)
          assert hashlib.sha256(raw).hexdigest() == expected
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert 'cws_m18_authority/__init__.py' in names
              assert 'cws_m18_authority/release_gate.py' in names
              assert 'cws_m18_authority/deployment_assurance.py' in names
              print({'runtime_sha256': expected, 'size': len(raw), 'member_count': len(names)})
          PY

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u4-exact-m18-artifact-bootstrap-evidence
          path: |
            build/m18-artifact-bootstrap/
            validation/unified/M18_ARTIFACT_BOOTSTRAP_REPORT.json
          if-no-files-found: warn
          retention-days: 7
