name: PDF V3 exact workbench source
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/pdf-v3-workbench-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Preserve exact source and native Git identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v3-source
          git archive --format=zip --output=build/v3-source/source.zip HEAD
          git bundle create build/v3-source/source.bundle HEAD
          git rev-parse HEAD > build/v3-source/COMMIT.txt
          git rev-parse HEAD^{tree} > build/v3-source/TREE.txt
          sha256sum build/v3-source/source.zip build/v3-source/source.bundle > build/v3-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Exact_Source_${{ github.sha }}
          path: build/v3-source/*
          retention-days: 14
          if-no-files-found: error
