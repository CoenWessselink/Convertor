name: Build standalone CWS Viewer V14 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cws-viewer-v14-ux-complete
    paths:
      - 'cws_viewer/**'
      - 'cws_convertor/**'
      - 'CWS_Viewer_Standalone.py'
      - 'CWS_Viewer_V14_Standalone.py'
      - 'CWS_Viewer_V14_Standalone.spec'
      - 'installer/CWS_Viewer_V14.iss'
      - 'requirements-viewer-standalone.lock.txt'
      - 'pyinstaller_hooks/**'
      - 'pyinstaller_runtime_hooks/**'
      - '.github/workflows/build-standalone-cws-viewer-v14.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      VIEWER_VERSION: 1.3.0-rc1
      EVIDENCE: ${{ github.workspace }}\validation\standalone-viewer-v14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile source and run V14 contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE | Out-Null
          python -m compileall -q CWS_Viewer_Standalone.py CWS_Viewer_V14_Standalone.py cws_viewer cws_convertor
          if ($LASTEXITCODE -ne 0) { throw 'V14 compileall failed' }
          python CWS_Viewer_V14_Standalone.py --v14-self-test | Tee-Object "$env:EVIDENCE\source_v14_selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source V14 contract self-test failed' }
          python CWS_Viewer_V14_Standalone.py --self-test --report "$env:EVIDENCE\source_native_selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source native/IFC-worker self-test failed' }

      - name: Source no-argument desktop startup gate
        shell: pwsh
        run: |
          $env:CWS_VIEWER_STARTUP_SMOKE = '1'
          $env:CWS_VIEWER_CI_HEADLESS = '1'
          $env:CWS_VIEWER_REPORT = Join-Path $env:EVIDENCE 'source_startup_smoke.json'
          $env:CWS_VIEWER_SCREENSHOT = Join-Path $env:EVIDENCE 'source_startup_smoke.png'
          python CWS_Viewer_V14_Standalone.py
          if ($LASTEXITCODE -ne 0) { throw 'Source no-argument startup gate failed' }
          Remove-Item Env:CWS_VIEWER_STARTUP_SMOKE -ErrorAction SilentlyContinue
          Remove-Item Env:CWS_VIEWER_CI_HEADLESS -ErrorAction SilentlyContinue
          Remove-Item Env:CWS_VIEWER_REPORT -ErrorAction SilentlyContinue
          Remove-Item Env:CWS_VIEWER_SCREENSHOT -ErrorAction SilentlyContinue

      - name: Create canonical project fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:EVIDENCE 'gui_fixture.cwscproj'
          python cli.py project-new $fixture --name 'CWS Viewer V14 CI Fixture' --client 'CWS' --order 'VIEWER-V14-CI'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $fixture)) { throw 'GUI fixture creation failed' }
          "CWS_VIEWER_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Source hosted headless project gate
        shell: pwsh
        run: |
          python CWS_Viewer_V14_Standalone.py "$env:CWS_VIEWER_FIXTURE" --gui-smoke --ci-headless --report "$env:EVIDENCE\source_gui_smoke.json" --screenshot "$env:EVIDENCE\source_gui_smoke.png"
          if ($LASTEXITCODE -ne 0) { throw 'Source hosted project gate failed' }

      - name: Build PyInstaller V14 onedir
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean CWS_Viewer_V14_Standalone.spec
          if (-not (Test-Path 'dist\CWS_Viewer\CWS_Viewer.exe')) { throw 'CWS_Viewer.exe missing' }

      - name: Packaged V14 and frozen IFC-worker gates
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\CWS_Viewer\CWS_Viewer.exe').Path
          $v14 = Join-Path $env:EVIDENCE 'packaged_v14_selftest.json'
          $v14Process = Start-Process -FilePath $exe -ArgumentList @('--v14-self-test') -Wait -PassThru -RedirectStandardOutput $v14 -WindowStyle Hidden
          if ($v14Process.ExitCode -ne 0 -or -not (Test-Path $v14)) { throw "Packaged V14 contract gate failed: $($v14Process.ExitCode)" }
          $v14Payload = Get-Content $v14 -Raw | ConvertFrom-Json
          if ($v14Payload.status -ne 'passed' -or -not $v14Payload.cockpit_imported -or -not $v14Payload.surface_backend_imported) { throw 'Packaged V14 modules were not certified' }
          if (-not $v14Payload.frozen) { throw 'V14 contract gate did not run frozen' }

          $native = Join-Path $env:EVIDENCE 'packaged_native_selftest.json'
          $nativeProcess = Start-Process -FilePath $exe -ArgumentList @('--self-test','--report',$native) -Wait -PassThru -WindowStyle Hidden
          if ($nativeProcess.ExitCode -ne 0 -or -not (Test-Path $native)) { throw "Packaged native gate failed: $($nativeProcess.ExitCode)" }
          $nativePayload = Get-Content $native -Raw | ConvertFrom-Json
          if ($nativePayload.checks.isolated_ifc_worker.transport -ne 'frozen_subprocess') { throw 'Frozen IFC worker is not explicit subprocess transport' }

      - name: Packaged startup and hosted project gates
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\CWS_Viewer\CWS_Viewer.exe').Path
          $startup = Join-Path $env:EVIDENCE 'packaged_startup_smoke.json'
          $shot = Join-Path $env:EVIDENCE 'packaged_startup_smoke.png'
          $env:CWS_VIEWER_STARTUP_SMOKE='1'; $env:CWS_VIEWER_CI_HEADLESS='1'; $env:CWS_VIEWER_REPORT=$startup; $env:CWS_VIEWER_SCREENSHOT=$shot
          $p = Start-Process -FilePath $exe -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $startup)) { throw 'Packaged startup gate failed' }
          Remove-Item Env:CWS_VIEWER_STARTUP_SMOKE,Env:CWS_VIEWER_CI_HEADLESS,Env:CWS_VIEWER_REPORT,Env:CWS_VIEWER_SCREENSHOT -ErrorAction SilentlyContinue
          $project = Join-Path $env:EVIDENCE 'packaged_gui_smoke.json'
          $projectShot = Join-Path $env:EVIDENCE 'packaged_gui_smoke.png'
          $q = Start-Process -FilePath $exe -ArgumentList @($env:CWS_VIEWER_FIXTURE,'--gui-smoke','--ci-headless','--report',$project,'--screenshot',$projectShot) -Wait -PassThru
          if ($q.ExitCode -ne 0 -or -not (Test-Path $project)) { throw 'Packaged hosted project gate failed' }

      - name: Create and re-test portable V14 without Python on PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_windows_v14 | Out-Null
          $portable = "release_windows_v14\CWS_Viewer_Portable_${env:VIEWER_VERSION}_x64.zip"
          Compress-Archive -Path 'dist\CWS_Viewer\*' -DestinationPath $portable -Force
          $root = Join-Path $env:RUNNER_TEMP 'CWSViewerV14Portable'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive $portable -DestinationPath $root
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $root 'CWS_Viewer.exe'
          $v14 = Join-Path $env:EVIDENCE 'portable_v14_selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--v14-self-test') -Wait -PassThru -RedirectStandardOutput $v14 -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Portable V14 self-test failed' }
          $native = Join-Path $env:EVIDENCE 'portable_native_selftest.json'
          $q = Start-Process -FilePath $exe -ArgumentList @('--self-test','--report',$native) -Wait -PassThru -WindowStyle Hidden
          if ($q.ExitCode -ne 0) { throw 'Portable native self-test failed' }
          $payload = Get-Content $native -Raw | ConvertFrom-Json
          if ($payload.checks.isolated_ifc_worker.transport -ne 'frozen_subprocess') { throw 'Portable IFC worker transport failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build V14 installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\CWS_Viewer_V14.iss
          if ($LASTEXITCODE -ne 0) { throw 'V14 installer build failed' }
          $setup = Get-ChildItem release_windows_v14 -Filter 'CWS_Viewer_Setup_1.3.0-rc1_x64.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'V14 installer missing' }

      - name: Installed V14 gates without external Python
        shell: pwsh
        run: |
          $setup = Get-ChildItem release_windows_v14 -Filter 'CWS_Viewer_Setup_1.3.0-rc1_x64.exe' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'CWSViewerV14Installed'
          $install = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',("/DIR=$target")) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $target 'CWS_Viewer.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $v14 = Join-Path $env:EVIDENCE 'installed_v14_selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--v14-self-test') -Wait -PassThru -RedirectStandardOutput $v14 -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Installed V14 self-test failed' }
          $native = Join-Path $env:EVIDENCE 'installed_native_selftest.json'
          $q = Start-Process -FilePath $exe -ArgumentList @('--self-test','--report',$native) -Wait -PassThru -WindowStyle Hidden
          if ($q.ExitCode -ne 0) { throw 'Installed native self-test failed' }
          $payload = Get-Content $native -Raw | ConvertFrom-Json
          if ($payload.checks.isolated_ifc_worker.transport -ne 'frozen_subprocess') { throw 'Installed IFC worker transport failed' }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (Test-Path $uninstaller) { $un = Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden; if ($un.ExitCode -ne 0) { throw 'Uninstall failed' } }

      - name: Build V14 release manifest and checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release_windows_v14 -File | Sort-Object Name
          $lines = foreach ($file in $files) { $hash=(Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $lines | Set-Content -Encoding ascii release_windows_v14\SHA256SUMS.txt
          [ordered]@{
            version=$env:VIEWER_VERSION; run_id=$env:GITHUB_RUN_ID; commit=$env:GITHUB_SHA; status='passed';
            rc3_worker_transport_preserved=$true;
            v14_contract='light_theme_cockpit_ifc_grid_surface_pick_navigation_measure_review';
            source_v14_contract=$true; packaged_v14_contract=$true; portable_v14_contract=$true; installed_v14_contract=$true;
            physical_windows_gpu_interaction_test_required=$true;
            files=@($files | ForEach-Object { [ordered]@{name=$_.Name;bytes=$_.Length;sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()} })
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release_windows_v14\WINDOWS_VIEWER_V14_RELEASE_MANIFEST.json
          Get-Content release_windows_v14\SHA256SUMS.txt

      - name: Upload V14 installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.3.0-rc1_INSTALLER_x64
          path: |
            release_windows_v14/CWS_Viewer_Setup_1.3.0-rc1_x64.exe
            release_windows_v14/SHA256SUMS.txt
            release_windows_v14/WINDOWS_VIEWER_V14_RELEASE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V14 portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.3.0-rc1_PORTABLE_x64
          path: release_windows_v14/CWS_Viewer_Portable_1.3.0-rc1_x64.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.3.0-rc1_EVIDENCE
          path: |
            validation/standalone-viewer-v14/*.json
            validation/standalone-viewer-v14/*.png
          if-no-files-found: warn
          retention-days: 30
