name: Verify lossless PDF table layout and rebuild exact-source installer
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-all-sheet-scale-build.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop superseded candidate after visible PDF table overlap was found
        uses: actions/github-script@v7
        with:
          script: |
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const old=(await github.rest.actions.getWorkflowRun({...repo,run_id:34467551141})).data;
            if(old.status!=='completed') {
              try {await github.rest.actions.cancelWorkflowRun({...repo,run_id:34467551141});}
              catch(error) {if(error.status!==409)throw error;}
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified lossless PDF-table repair and stricter installed proof
        shell: python
        run: |
          import hashlib,json,lzma,os,pathlib,subprocess
          path=pathlib.Path('.github/v3-schedule-layout.xz');payload=path.read_bytes()
          assert hashlib.sha256(payload).hexdigest()=='86d6ea139a42ac8b1703d014911c14e5e7a6464ab72de34e1478e0e43c8fe08a'
          patch=lzma.decompress(payload)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          manifest=json.loads(pathlib.Path('.github/v3-reviewed-patch/MANIFEST.json').read_text())
          for filename,expected in manifest['files'].items():
              data=pathlib.Path(filename).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,filename
              if filename.endswith('.py'):compile(data,filename,'exec')
          subprocess.run(['git','diff','--check'],check=True)
          allowed={'cws_convertor/drawings/engine.py','cws_convertor/ui_qt/pdf_v3_completion_evidence.py','docs/PDF_UI_V3_RESUMED_20260910.md','.github/v3-reviewed-patch/MANIFEST.json','tests/drawing_v3_schedule_layout_smoke.py','tools/build_tested_installer.py','tools/verify_integrated_delivery.py'}
          subprocess.run(['git','add','--',*allowed],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['git','rm',str(path)],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(pdf): wrap complete schedule IDs and paginate measured rows without clipping or data loss'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/cws-pdf-ui-v3-complete-20260909'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FINAL_SOURCE_SHA='+sha+'\n')
          print('FINAL_SOURCE_SHA='+sha)
      - name: Dispatch full Windows acceptance for corrected final source
        uses: actions/github-script@v7
        with:
          script: |
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const branch='agent/cws-pdf-ui-v3-complete-20260909';
            const ref=(await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data;
            if(ref.object.sha!==process.env.FINAL_SOURCE_SHA)throw new Error('Branch changed before dispatch');
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'installer-delivery.yml',ref:branch});
            core.notice('Rebuild dispatched for '+process.env.FINAL_SOURCE_SHA);
      - name: Preserve corrected final source identity
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('build/v3-final-source');out.mkdir(parents=True,exist_ok=True)
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip()
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'source.zip'),'HEAD'],check=True)
          subprocess.run(['git','bundle','create',str(out/'source.bundle'),'HEAD'],check=True)
          (out/'COMMIT.txt').write_text(os.environ['FINAL_SOURCE_SHA']+'\n')
          (out/'TREE.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True))
          (out/'VERIFICATION.json').write_text(json.dumps({'source_commit':os.environ['FINAL_SOURCE_SHA'],'reviewed_files':json.loads(pathlib.Path('.github/v3-reviewed-patch/MANIFEST.json').read_text())['files'],'all_file_hashes_verified':True,'external_v3_specification_verified':False},indent=2))
          (out/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256((out/name).read_bytes()).hexdigest()+'  '+name for name in ('source.zip','source.bundle'))+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Reviewed_Final_Source_${{ env.FINAL_SOURCE_SHA }}
          path: build/v3-final-source/*
          retention-days: 14
          if-no-files-found: error
