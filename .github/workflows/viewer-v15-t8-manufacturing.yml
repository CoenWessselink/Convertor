name: CWS Viewer V15 T8 manufacturing geometry gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_convertor/manufacturing/**'
      - 'cws_viewer/ui_qt/manufacturing_faces_v15.py'
      - 'cws_viewer/ui_qt/contact_geometry_v15.py'
      - 'cws_viewer/ui_qt/cockpit_t8_v15.py'
      - 'cws_viewer/ui_qt/cockpit_progress_v15.py'
      - 'CWS_Viewer_V15_Standalone.py'
      - 'tests/manufacturing_face_core_smoke.py'
      - 'tests/manufacturing_contact_core_smoke.py'
      - 'tests/viewer_v15_**'
      - '.github/workflows/viewer-v15-t8-manufacturing.yml'

permissions:
  contents: read

jobs:
  t8-contract:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile T8 modules
        shell: pwsh
        run: |
          python -m compileall -q `
            cws_convertor/manufacturing `
            cws_viewer/ui_qt/manufacturing_faces_v15.py `
            cws_viewer/ui_qt/cockpit_t8_v15.py `
            cws_viewer/ui_qt/cockpit_progress_v15.py `
            CWS_Viewer_V15_Standalone.py
          if ($LASTEXITCODE -ne 0) { throw 'T8 compileall failed' }

      - name: Run T3 through T7 no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_navigation_contract_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T3 regression failed' }
          python tests/viewer_v15_selection_measurement_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T4 regression failed' }
          python tests/viewer_v15_review_workspace_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T5 regression failed' }
          python tests/viewer_v15_coordination_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T6 regression failed' }
          python tests/viewer_v15_export_center_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T7 regression failed' }

      - name: Run deterministic ManufacturingFace core tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation\viewer-v15-t8 | Out-Null
          python tests/manufacturing_face_core_smoke.py 2>&1 | Tee-Object validation\viewer-v15-t8\manufacturing_face_core.txt
          if ($LASTEXITCODE -ne 0) { throw 'ManufacturingFace core failed' }

      - name: Run exact ContactPatch core tests
        shell: pwsh
        run: |
          python tests/manufacturing_contact_core_smoke.py 2>&1 | Tee-Object validation\viewer-v15-t8\manufacturing_contact_core.txt
          if ($LASTEXITCODE -ne 0) { throw 'Exact ContactPatch core failed' }

      - name: Run V15 self-test contract
        shell: pwsh
        run: |
          python CWS_Viewer_V15_Standalone.py --v15-self-test | Tee-Object validation\viewer-v15-t8\v15_selftest.json
          if ($LASTEXITCODE -ne 0) { throw 'V15 T8 self-test failed' }

      - name: Upload T8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_V15_T8_diagnostics
          path: validation/viewer-v15-t8/*
          if-no-files-found: warn
          retention-days: 14
