name: Integrated repair source evidence
on:
  push:
    branches: [agent/cws-integrated-gap-repair-20260909]
    paths: ['.github/workflows/integrated-source-evidence.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture tracked source and exact blob identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-evidence
          git archive --format=zip -o build/source-evidence/source.zip HEAD
          git rev-parse HEAD > build/source-evidence/COMMIT.txt
          git rev-parse HEAD^{tree} > build/source-evidence/TREE.txt
          git ls-tree -r HEAD > build/source-evidence/FILES.txt
          sha256sum build/source-evidence/source.zip > build/source-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Integrated_Source_${{ github.sha }}
          path: build/source-evidence/*
          retention-days: 7
          if-no-files-found: error
