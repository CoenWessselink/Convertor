name: CWS Viewer V15 T10 M8 manufacturing export gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_viewer/export_center/manufacturing_*.py'
      - 'cws_viewer/export_center/__init__.py'
      - 'tests/viewer_v15_manufacturing_export_smoke.py'
      - '.github/workflows/viewer-v15-t10-manufacturing-export.yml'

permissions:
  contents: read

jobs:
  m8-manufacturing-export-contract:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile M8 modules
        shell: pwsh
        run: |
          python -m compileall -q cws_viewer/export_center/manufacturing_models.py cws_viewer/export_center/manufacturing_service.py tests/viewer_v15_manufacturing_export_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M8 compileall failed' }

      - name: Run T7 scope no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_export_center_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T7 export-center regression failed' }

      - name: Run M7 no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_neutral_job_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M7 neutral-job regression failed' }

      - name: Run deterministic M8 manufacturing package contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation\viewer-v15-m8 | Out-Null
          python tests/viewer_v15_manufacturing_export_smoke.py 2>&1 | Tee-Object validation\viewer-v15-m8\m8_manufacturing_export.txt
          if ($LASTEXITCODE -ne 0) { throw 'M8 manufacturing export contract failed' }

      - name: Upload M8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_V15_M8_manufacturing_export_diagnostics
          path: validation/viewer-v15-m8/*
          if-no-files-found: warn
          retention-days: 14
