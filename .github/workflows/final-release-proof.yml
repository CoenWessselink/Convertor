name: Final release proof

on:
  push:
    branches: [agent/cws-product-ui-reintegration-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-windows-release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_VERSION: 0.10.18-beta-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert exact clean source SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.sha }}") { throw "Checkout SHA mismatch" }
          if (git status --porcelain=v1) { throw "Checkout is unexpectedly dirty" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock.txt
            requirements-build.lock.txt

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock.txt
          python -m pip check

      - name: Restore packaged M18 authority
        shell: pwsh
        run: python tools/restore_m18_authority.py

      - name: Compile and run source acceptance
        shell: pwsh
        run: |
          python -m compileall -q cws_convertor cws_viewer CWS_Convertor_App.py
          python tests/conversion_one_phase_contract_smoke.py
          python tools/capture_phase1_repository_ci.py
          python tools/run_phase1_unified_gates.py
          python tools/build_phase1_reproducible_evidence.py
          python tools/run_phase2_unified_gates.py
          python tools/run_phase3_gates.py

      - name: Upload source acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_${{ github.sha }}_Source_Diagnostics
          path: |
            validation/phases/PHASE_*_EVIDENCE.json
            validation/results/phase3/**
          if-no-files-found: warn
          retention-days: 30

      - name: Assert tracked source remains exact after acceptance
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ github.sha }}") { throw "Source SHA changed during acceptance" }
          $tracked = git status --porcelain=v1 --untracked-files=no
          if ($tracked) {
            $tracked | Write-Host
            throw "Acceptance changed tracked source"
          }

      - name: Build Phase 1 Windows evidence
        shell: pwsh
        run: |
          python tools/build_phase1_windows_release.py
          python tools/build_phase1_validation.py

      - name: Build Phase 2 Windows evidence
        shell: pwsh
        run: |
          python tools/build_phase2_windows_release.py --skip-build
          python tools/build_phase2_validation.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and test final Phase 3 runtime
        shell: pwsh
        run: |
          python tools/build_phase3_windows_release.py --skip-build
          python tools/build_phase3_validation.py

      - name: Prove all 12 conversions in exact-SHA packaged runtime
        shell: pwsh
        run: |
          python tests/conversion_one_phase_packaged_smoke.py `
            --runtime-dir dist/CWS_Convertor `
            --output validation/full_acceptance/CONVERSION_PACKAGED_MATRIX.json `
            --expected-sha "${{ github.sha }}"

      - name: Install pinned Mesa software OpenGL for headless VTK acceptance
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '23.3.3'
          build-type: 'release-msvc'
          deployment-choice: '1'

      - name: Full Product Acceptance 51 of 51
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/run_full_product_acceptance.py --reuse-fresh-phase3-evidence
          python tools/build_superprompt_acceptance_report.py
          $check = Get-Content validation/full_acceptance/FULL_ACCEPTANCE_CHECKLIST.json -Raw | ConvertFrom-Json
          if ($check.checks.Count -ne 51) { throw "Acceptance does not contain 51 checks" }
          if (@($check.checks | Where-Object status -ne PASS).Count -ne 0) { throw "Acceptance contains a non-PASS item" }

      - name: Record fresh checkout evidence
        shell: pwsh
        run: |
          $tracked = git status --porcelain=v1 --untracked-files=no
          $payload = [ordered]@{
            status = "PASS"
            branch = "agent/cws-product-ui-reintegration-v1"
            commit = (git rev-parse HEAD).Trim()
            working_tree_clean = -not [bool]$tracked
            tracked_worktree_clean = -not [bool]$tracked
            generated_evidence_allowed = $true
            checkout = "actions/checkout exact github.sha"
          }
          $payload | ConvertTo-Json | Set-Content -Encoding utf8 validation/full_acceptance/FRESH_CHECKOUT_EVIDENCE.json

      - name: Bind final release and verify checksums
        shell: pwsh
        run: |
          python tools/finalize_commit_bound_release.py --ci PASS
          if (Get-ChildItem release/final -File | Where-Object Name -Match uncommitted) { throw "Uncommitted artifact name found" }
          $tracked = git status --porcelain=v1 --untracked-files=no
          if ($tracked) {
            $tracked | Write-Host
            throw "Acceptance changed tracked source"
          }

      - name: Upload exact-SHA final release
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_${{ env.CWS_VERSION }}_${{ github.sha }}_Final
          path: |
            release/final/*
            validation/full_acceptance/FULL_ACCEPTANCE_CHECKLIST.json
            validation/full_acceptance/FULL_ACCEPTANCE_REPORT.md
            validation/full_acceptance/FULL_ACCEPTANCE_EVIDENCE_MATRIX.json
            validation/full_acceptance/RELEASE_BINDING.json
            validation/full_acceptance/FINAL_RELEASE_PROOF.md
            validation/full_acceptance/CONVERSION_PACKAGED_MATRIX.json
            validation/full_acceptance/conversion_packaged_matrix_evidence/**
          if-no-files-found: error
          retention-days: 90
