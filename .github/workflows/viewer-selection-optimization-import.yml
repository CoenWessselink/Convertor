name: Viewer selection optimization import
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths:
      - '.github/workflows/viewer-selection-optimization-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viewer-selection-optimization-import
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/cws-pdf-ui-v3-complete-20260909
      PATCH_SHA256: 5f69601522c573a0a6815dbc733a6296ecac3700500867818e60580667276dd7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and verify immutable tested source patch parts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const parts = [
              ['446d0a90120b1d337aab2df301baecadb6197d39', '9bb72ea609f9e93512d36de0c81a97b176f0c2e5d8caef42ef75bb0dfa549a30'],
              ['9d7111082f604198f8959f9c9a9c4d081c564d1e', 'f7bc4f117bff1e44de8ae8deb19731d72b22cdfaf06ed8dcef8f8c7dc293c0b2'],
              ['7a856c92effdb5896afd25628c6c0740053d0c51', '3e2b6c0434c4574ba07b2e6850d9651e7f36f7fe13424651e42cd540da75b5a8'],
              ['5b082d195ae65fd82844e5d2b8612b622bded137', 'bd17ca859ebd63acb091ed72b5de7128115ffc6f3a5e327dbcd4ed7c71c78bd4'],
            ];
            const buffers = [];
            for (let i = 0; i < parts.length; i++) {
              const [sha, expected] = parts[i];
              const response = await github.rest.git.getBlob({...context.repo, file_sha: sha});
              const data = Buffer.from(response.data.content.replace(/\s/g, ''), 'base64');
              const digest = crypto.createHash('sha256').update(data).digest('hex');
              if (digest !== expected) throw new Error(`Patch part ${i} mismatch: ${digest}`);
              buffers.push(data);
            }
            const patch = Buffer.concat(buffers);
            const fullDigest = crypto.createHash('sha256').update(patch).digest('hex');
            if (fullDigest !== process.env.PATCH_SHA256) throw new Error(`Full patch mismatch: ${fullDigest}`);
            fs.writeFileSync('/tmp/phase_cd.patch', patch);
      - name: Apply source patch to latest coordinated branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          git config user.name 'CWS Viewer Optimization Build'
          git config user.email 'cws-viewer-build@users.noreply.github.com'
          git am --3way /tmp/phase_cd.patch
          git diff HEAD^ --check
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
          git diff --stat HEAD^ > evidence/change_stat.txt
          sha256sum /tmp/phase_cd.patch > evidence/PATCH_SHA256
      - name: Install locked native runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          python -m pip install -r requirements-runtime.lock.txt pytest
          python -m pip freeze > evidence/runtime.txt
      - name: Run native scheduler selection and identity regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1680x1050x24' env QT_QPA_PLATFORM=xcb python -m pytest -q \
            tests/viewer_render_scheduler_smoke.py \
            tests/viewer_runtime_profiler_smoke.py \
            tests/viewer_scheduler_native_smoke.py \
            tests/viewer_native_initialization_smoke.py \
            tests/viewer_v15_selection_pivot_parity_smoke.py \
            tests/viewer_v15_trimble_feel_v2_smoke.py \
            tests/viewer_v15_feel_fix_smoke.py \
            tests/viewer_v2_core_controller_smoke.py \
            tests/bom_selection_identity_smoke.py \
            tests/viewer_indexed_picking_smoke.py \
            tests/viewer_persistent_selection_overlay_smoke.py \
            --junitxml=evidence/tests.xml 2>&1 | tee evidence/tests.log
          sha256sum evidence/tests.xml evidence/tests.log > evidence/SHA256SUMS
      - name: Fast-forward publish exact tested source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat evidence/source_commit.txt)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:"$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Viewer_Selection_Optimization_${{ github.run_id }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 30
