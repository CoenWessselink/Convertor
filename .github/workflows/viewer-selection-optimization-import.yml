name: Viewer selection optimization import
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/viewer-selection-optimization-import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viewer-selection-optimization-import
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/cws-pdf-ui-v3-complete-20260909
      PATCH_SHA256: 91f8b95b0c9038cff317379fbf01e9b8d9890d2356db36d9af3d563739a48321
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assemble verified exact-bundle patch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const parts = [
              ['6955ddb8fd90af3ae359357d6eed01c69249929f','2be96df4a480b021964cfc3b2a35a6936f4b185f665f581e293ddddb692246ae'],
              ['c5ac7922dbc6946fe2b6b71a9ac56b314d93dc2e','205f8b3b54493bdf0d4439bea39c796577a5830e20e3ee655738b1801ebbf373'],
              ['5682cd05f02f0ca1ee10ef875795efee518e36aa','96c985f21e64e6252b0493ad558acd103175b025331b90eb78ba233bee8a464d'],
              ['d9b081bce945e7b5f1f0a1fcf8c2fcb74631ea12','2234228da688daabdac0062f68a76b609f0d15d3fa42103073d14dc05977dfce']
            ];
            const chunks=[];
            for (let i=0;i<parts.length;i++) {
              const r=await github.rest.git.getBlob({...context.repo,file_sha:parts[i][0]});
              const b=Buffer.from(r.data.content.replace(/\s/g,''),'base64');
              const d=crypto.createHash('sha256').update(b).digest('hex');
              if(d!==parts[i][1]) throw new Error(`part ${i} ${d}`);
              chunks.push(b);
            }
            const patch=Buffer.concat(chunks), d=crypto.createHash('sha256').update(patch).digest('hex');
            if(d!==process.env.PATCH_SHA256) throw new Error(`full ${d}`);
            fs.writeFileSync('/tmp/load.mbox',patch);
      - name: Apply to current coordinated HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          git config user.name 'CWS Viewer Optimization Build'
          git config user.email 'cws-viewer-build@users.noreply.github.com'
          git am --3way /tmp/load.mbox
          git diff HEAD~2 --check
          mkdir -p evidence
          git rev-parse HEAD > evidence/source_commit.txt
          git log -2 --format='%H %P %s' > evidence/commits.txt
          sha256sum /tmp/load.mbox > evidence/PATCH_SHA256
      - name: Install locked native runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          python -m pip install -r requirements-runtime.lock.txt pytest
          python -m pip freeze > evidence/runtime.txt
      - name: Native regression gate
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1680x1050x24' env QT_QPA_PLATFORM=xcb python -m pytest -q \
            tests/viewer_render_scheduler_smoke.py tests/viewer_runtime_profiler_smoke.py \
            tests/viewer_scheduler_native_smoke.py tests/viewer_native_initialization_smoke.py \
            tests/viewer_v15_selection_pivot_parity_smoke.py tests/viewer_v15_trimble_feel_v2_smoke.py \
            tests/viewer_v15_feel_fix_smoke.py tests/viewer_v2_core_controller_smoke.py \
            tests/bom_selection_identity_smoke.py tests/viewer_indexed_picking_smoke.py \
            tests/viewer_persistent_selection_overlay_smoke.py tests/viewer_screen_selection_bulk_projection_smoke.py \
            tests/viewer_source_mirror_smoke.py tests/performance_loading_v2_smoke.py \
            --junitxml=evidence/tests.xml 2>&1 | tee evidence/tests.log
          sha256sum evidence/tests.xml evidence/tests.log > evidence/SHA256SUMS
      - name: Publish only exact tested commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat evidence/source_commit.txt)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin "$BRANCH"
          git merge-base --is-ancestor "origin/$BRANCH" HEAD
          git push origin HEAD:"$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Viewer_Exact_Bundle_Load_${{ github.run_id }}
          path: evidence/*
          if-no-files-found: warn
          retention-days: 30
