name: Continuous integration build

on:
  push:
    branches: [agent/cws-continuous-integration-20260908]
    paths:
      - '.github/workflows/continuous-integration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/continuous-source
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
          git archive --format=zip HEAD -o build/continuous-source/source.zip
          git bundle create build/continuous-source/source.bundle HEAD
          git rev-parse HEAD > build/continuous-source/COMMIT.txt
          git rev-parse HEAD^{tree} > build/continuous-source/TREE.txt
          sha256sum build/continuous-source/source.zip build/continuous-source/source.bundle > build/continuous-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Continuous_Source_${{ github.sha }}
          path: build/continuous-source/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare offline Linux UI development dependencies
        run: python -m pip download --only-binary=:all: --dest build/continuous-wheels PySide6==6.9.2 ifcopenshell==0.8.5
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Continuous_Linux_UI_Wheels
          path: build/continuous-wheels/*
          if-no-files-found: error
          retention-days: 7
