name: Prepare reviewed scoped BOM action repair
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-bom-gap-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve exact hash-verified patch transport
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const ids=['e191a28c2f5c5771ca05fffaade667ca202cc7f1','1c24d96406900feaf083f5b990d1281e0f498cb2','a07f910aa291e2bce0b79e75f36a6754442c4667','605c8bb9f6df16390cb38f370d1198352b935932','a2e922170b5d679917269932afc3ea8834667d8a','7ef38516aabd8c11d57eca804731a9e84e3ef5cf','a886ef2d3e11a987a9465a72de5271c01fc167e9','3eefa3cda803d1ed29ed8b3ef043f9be89151197','02e1955d35e56d96a105bf21b16d0a010616f3d5','099c5c83d69c7f1db3630ce6cd56a7e11cccadc7'];
            const chunks=[];
            for(let i=0;i<ids.length;i++){
              const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:ids[i]})).data;
              let encoded=blob.content.replace(/\s/g,'');
              // One extra base64 character in transport chunk zero was
              // independently reproduced locally. Restore the reviewed bytes;
              // the original blob SHA and whole-patch hashes below are mandatory.
              if(i===0){
                encoded=encoded.replace('EeZFnLcT7Tvf','EeZFnLc7Tvf');
                encoded=encoded.slice(0,3900)+'Zvm986ch6uhvYjraVXsDxYV8Lh5ewFmK9x6NglU1gX0PoklvHI99/ykI65O9o8/GvrrhRyNeXZVkjT1W19IfeEF2IkotJs1ASA8I';
              }
              const data=Buffer.from(encoded,'base64');
              const actual=crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');
              if(actual!==(i===0?'a3a503b79f4c999273f82ef9c627c836188974a8':ids[i]))throw new Error('Patch chunk mismatch '+i);
              chunks.push(data);
            }
            const data=Buffer.concat(chunks);
            if(data.length!==27276||crypto.createHash('sha256').update(data).digest('hex')!=='deb5189e48f9cbd392a18dd4981d54f125bec988694877de3c6b8a1297830ba3')throw new Error('Compressed patch mismatch');
            fs.writeFileSync('/tmp/bom.patch.gz',data);
      - name: Verify baseline and every reviewed source file
        shell: python
        run: |
          import gzip,hashlib,json,pathlib,py_compile,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='e5e28fb4ce2a504f244dce829f5247a3af366cfc','Branch moved; re-review required'
          patch=gzip.decompress(pathlib.Path('/tmp/bom.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='0a48bd26145079381802dc02c89554d7c41d1c4bfc66be64df05ded738a07f15'
          path=pathlib.Path('/tmp/bom.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected={
            'CWS_Convertor_App.py':'65a2af0891cd68217248459e066378d00a1b0efe550c763620bf7e7e4bf47861',
            'cws_convertor/bom/production_hub.py':'9bfcf7989422859d7f240c0838fb115a6433b81dbd672a1bba8af26c337d9366',
            'cws_convertor/optimization/plate_nesting/project_service.py':'294963bc93b1926a8a37040d6439debd3f465fd734b02b91357fa91cdebc55f4',
            'cws_convertor/optimization/profile_nesting/eligibility.py':'9c2c81ababc68fe5287e9471593cc76bdb7b59518fde9b4c3e910ea95a135983',
            'cws_convertor/optimization/profile_nesting/phase2.py':'e6518be298e0ed3f785ddd2f5bd4002cde414fa824147e3e7966104ad282987a',
            'cws_convertor/optimization/profile_nesting/phase5_job.py':'1dacc38154bc3a57d2ee8396c31475343cfcc884b18a8b8f9e58faf511673e37',
            'cws_convertor/optimization/profile_nesting/stock.py':'28ece62605a1536254ee6745182d361cd7b705b65a63b5f9e8d565260faa0c75',
            'cws_convertor/ui_qt/bom_action_dispatch.py':'ccd794374ba768851ccb16ddf4c67711380578da802234de23d7da7d11719730',
            'cws_convertor/ui_qt/bom_action_evidence.py':'a4ca282e1611205414a95189275673249aca90ea3e2a7f079320ff5338242fca',
            'cws_convertor/ui_qt/bom_workspace.py':'8b3801d9d53782b060a147f6785dfaef56851b565b510a92e5ca1b2a18dd53b3',
            'cws_convertor/ui_qt/pdf_ui_v3_evidence.py':'6fe742fdb9f32fccc8cc8dca290470de2c20385129bbba74d466b156d479b991',
            'cws_convertor/ui_qt/phase3_workspaces.py':'516f9635c8320373cdd4984a57564bed237a05757182ab3ef5c182a26fdf1db3',
            'cws_convertor/ui_qt/product_workspaces.py':'05cd3ee1b2b116a523c0d3d5024cfe3b0e423d6ede40eb6944025e36ea0a27eb',
            'cws_convertor/ui_qt/v5_workspaces.py':'cdcfd7fc795cc72a9560573b470657afce671c9e43fe728481c98a7c4c8092b8',
            'docs/BOM_ACTION_GAP_REPAIR_20260911.md':'396f695b0a2913090111a27fd6655cf79b8917139d74c6cfa2d614a9cee71421',
            'tests/bom_action_routing_smoke.py':'758452d2f719b762bca21e6305d5706c4e103041db4bfa393cc0093f40614459',
            'tests/bom_scope_safety_smoke.py':'003f439356daa969faf8fd4ae597e02827fdc5af0008298a878bba14ced58d50',
            'tests/ui_v3_delivery_paths_smoke.py':'91d68d186a07592db3f27f31578135cdc287c860803da4f5aabe64c95defad7a',
            'tools/build_tested_installer.py':'c7d45d5f306a1641a91594a69223d1d4d6d85fc5f8a3c6921e0bc3917eafb8e3',
            'tools/finalize_ui_v3_delivery.py':'fe07d42e9a0d6545d9b66eedd69a4ab061c8952555eafa5b1e6b822a9a7bf039'
          }
          for name,digest in expected.items():
              p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
              if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/bom-files.json').write_text(json.dumps(expected))
      - name: Store reviewed source blobs without moving branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');const repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/bom-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data;
            const tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const data=fs.readFileSync(path);
              if(crypto.createHash('sha256').update(data).digest('hex')!==hash)throw new Error(path);
              const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            tree.push({path:'.github/workflows/prepare-bom-gap-repair.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'c17c233ac0681fc0ad398f3f8636ea0e113a1108',tree,files:expected,branch_updated:false,release_tests_passed:false,scope:'Hash-verified source repair only; new Windows native/installed acceptance mandatory.'};
            fs.mkdirSync('prepared',{recursive:true});
            fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log('REVIEWED_BOM_TREE='+JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_BOM_Reviewed_Tree_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
