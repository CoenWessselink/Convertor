name: Build standalone CWS Viewer V15 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_viewer/**'
      - 'cws_convertor/**'
      - 'tests/viewer_v15_**'
      - 'tests/manufacturing_face_core_smoke.py'
      - 'docs/viewer/TRIMBLE_*V15*.md'
      - 'CWS_Viewer_Standalone.py'
      - 'CWS_Viewer_V15_Standalone.py'
      - 'CWS_Viewer_V15_Standalone.spec'
      - 'installer/CWS_Viewer_V15.iss'
      - 'requirements-viewer-standalone.lock.txt'
      - 'pyinstaller_hooks/**'
      - 'pyinstaller_runtime_hooks/**'
      - '.github/workflows/build-standalone-cws-viewer-v15.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      VIEWER_VERSION: 1.4.0-v15-preview.2
      EVIDENCE: ${{ github.workspace }}\validation\standalone-viewer-v15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile source and run V15 contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE | Out-Null
          python -m compileall -q CWS_Viewer_Standalone.py CWS_Viewer_V15_Standalone.py cws_viewer cws_convertor
          if ($LASTEXITCODE -ne 0) { throw 'V15 compileall failed' }
          python tests/viewer_v15_workspace_contract_smoke.py | Tee-Object "$env:EVIDENCE\source_workspace_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 workspace contract smoke failed' }
          python tests/viewer_v15_navigation_contract_smoke.py | Tee-Object "$env:EVIDENCE\source_t3_navigation_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T3 navigation contract failed' }
          python tests/viewer_v15_interaction_foundation_smoke.py | Tee-Object "$env:EVIDENCE\source_t3_interaction_foundation.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T3 interaction foundation failed' }
          python tests/viewer_v15_selection_pivot_parity_smoke.py | Tee-Object "$env:EVIDENCE\source_t3_selection_pivot_parity.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 selected-object orbit/zoom parity failed' }
          python tests/viewer_v15_trimble_input_contract_smoke.py | Tee-Object "$env:EVIDENCE\source_t3_trimble_input_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 Trimble-style desktop handling contract failed' }
          python tests/viewer_v15_feel_fix_smoke.py | Tee-Object "$env:EVIDENCE\source_quality_fix_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 Quality Fix contract failed' }
          python tests/viewer_v15_trimble_feel_v2_smoke.py | Tee-Object "$env:EVIDENCE\source_trimble_feel_v2_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 preview.2 Trimble-feel contract failed' }
          python tests/viewer_v15_selection_measurement_smoke.py | Tee-Object "$env:EVIDENCE\source_t4_selection_measurement_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T4 selection/measurement contract failed' }
          python tests/viewer_v15_review_workspace_smoke.py | Tee-Object "$env:EVIDENCE\source_t5_review_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T5 review contract failed' }
          python tests/viewer_v15_coordination_smoke.py | Tee-Object "$env:EVIDENCE\source_t6_coordination_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T6 coordination contract failed' }
          python tests/viewer_v15_export_center_smoke.py | Tee-Object "$env:EVIDENCE\source_t7_export_center_contract.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T7 export-center contract failed' }
          python tests/manufacturing_face_core_smoke.py | Tee-Object "$env:EVIDENCE\source_t8_manufacturing_faces.txt"
          if ($LASTEXITCODE -ne 0) { throw 'V15 T8 ManufacturingFace contract failed' }
          python CWS_Viewer_V15_Standalone.py --v15-self-test | Tee-Object "$env:EVIDENCE\source_v15_selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source V15 contract self-test failed' }
          python CWS_Viewer_V15_Standalone.py --self-test --report "$env:EVIDENCE\source_native_selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source native/IFC-worker self-test failed' }

      - name: Create canonical project fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:EVIDENCE 'gui_fixture.cwscproj'
          python cli.py project-new $fixture --name 'CWS Viewer V15 CI Fixture' --client 'CWS' --order 'VIEWER-V15-CI'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $fixture)) { throw 'V15 GUI fixture creation failed' }
          "CWS_VIEWER_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Source V15 hosted GUI gate
        shell: pwsh
        run: |
          python CWS_Viewer_V15_Standalone.py "$env:CWS_VIEWER_FIXTURE" --gui-smoke --ci-headless --report "$env:EVIDENCE\source_gui_smoke.json" --screenshot "$env:EVIDENCE\source_gui_smoke.png"
          if ($LASTEXITCODE -ne 0) { throw 'Source V15 hosted GUI gate failed' }
          if (-not (Test-Path "$env:EVIDENCE\source_gui_smoke.png")) { throw 'Source V15 screenshot missing' }

      - name: Build PyInstaller V15 onedir
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean CWS_Viewer_V15_Standalone.spec
          if (-not (Test-Path 'dist\CWS_Viewer\CWS_Viewer.exe')) { throw 'CWS_Viewer.exe missing' }

      - name: Packaged V15 and frozen worker gates
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\CWS_Viewer\CWS_Viewer.exe').Path
          $v15 = Join-Path $env:EVIDENCE 'packaged_v15_selftest.json'
          $v15Process = Start-Process -FilePath $exe -ArgumentList @('--v15-self-test') -Wait -PassThru -RedirectStandardOutput $v15 -WindowStyle Hidden
          if ($v15Process.ExitCode -ne 0 -or -not (Test-Path $v15)) { throw "Packaged V15 contract gate failed: $($v15Process.ExitCode)" }
          $v15Payload = Get-Content $v15 -Raw | ConvertFrom-Json
          if ($v15Payload.status -ne 'passed' -or -not $v15Payload.v15_cockpit_imported) { throw 'Packaged V15 cockpit was not certified' }
          if (-not $v15Payload.t3_navigation_imported -or -not $v15Payload.t4_selection_measurement_imported -or -not $v15Payload.t5_review_workspace_imported -or -not $v15Payload.t6_coordination_imported -or -not $v15Payload.t7_export_center_imported -or -not $v15Payload.t8_manufacturing_faces_imported) { throw 'Packaged V15 T3/T4/T5/T6/T7/T8 layers were not certified' }
          if (-not $v15Payload.trimble_style_handling_contract_certified -or -not $v15Payload.selected_object_orbit_pivot_certified -or -not $v15Payload.active_pivot_zoom_certified) { throw 'Packaged V15 selected-object handling was not certified' }
          if (-not $v15Payload.upright_orbit_certified -or -not $v15Payload.source_ifc_colours_certified -or -not $v15Payload.contact_shading_certified -or -not $v15Payload.selected_fill_highlight_certified) { throw 'Packaged V15 preview.2 rendering/navigation was not certified' }
          if (-not $v15Payload.ctrl_multiselect_certified -or -not $v15Payload.bidirectional_list_selection_certified -or -not $v15Payload.assembly_part_level_certified -or -not $v15Payload.views_strip_certified -or -not $v15Payload.measurement_foreground_certified) { throw 'Packaged V15 preview.2 UI workflow was not certified' }
          if (-not $v15Payload.workspace.capabilities.selection_pivot_precedence -or -not $v15Payload.workspace.capabilities.active_pivot_zoom -or -not $v15Payload.workspace.capabilities.viewer_undo_redo_shortcuts) { throw 'Packaged V15 handling capabilities are incomplete' }
          if (-not $v15Payload.frozen) { throw 'V15 contract gate did not run frozen' }
          if ($v15Payload.production_marking_released -or $v15Payload.production_machine_transfer_allowed) { throw 'Preview build must not enable marking/machine production release' }

          $native = Join-Path $env:EVIDENCE 'packaged_native_selftest.json'
          $nativeProcess = Start-Process -FilePath $exe -ArgumentList @('--self-test','--report',$native) -Wait -PassThru -WindowStyle Hidden
          if ($nativeProcess.ExitCode -ne 0 -or -not (Test-Path $native)) { throw "Packaged native gate failed: $($nativeProcess.ExitCode)" }
          $nativePayload = Get-Content $native -Raw | ConvertFrom-Json
          if ($nativePayload.checks.isolated_ifc_worker.transport -ne 'frozen_subprocess') { throw 'Frozen IFC worker is not explicit subprocess transport' }

      - name: Packaged V15 hosted GUI gate
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\CWS_Viewer\CWS_Viewer.exe').Path
          $report = Join-Path $env:EVIDENCE 'packaged_gui_smoke.json'
          $shot = Join-Path $env:EVIDENCE 'packaged_gui_smoke.png'
          $p = Start-Process -FilePath $exe -ArgumentList @($env:CWS_VIEWER_FIXTURE,'--gui-smoke','--ci-headless','--report',$report,'--screenshot',$shot) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report) -or -not (Test-Path $shot)) { throw 'Packaged V15 hosted GUI gate failed' }

      - name: Create portable V15 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_windows_v15 | Out-Null
          $portable = "release_windows_v15\CWS_Viewer_Portable_${env:VIEWER_VERSION}_x64.zip"
          Compress-Archive -Path 'dist\CWS_Viewer\*' -DestinationPath $portable -Force
          $root = Join-Path $env:RUNNER_TEMP 'CWSViewerV15Portable'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive $portable -DestinationPath $root
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $root 'CWS_Viewer.exe'
          $out = Join-Path $env:EVIDENCE 'portable_v15_selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--v15-self-test') -Wait -PassThru -RedirectStandardOutput $out -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Portable V15 self-test failed' }
          $payload = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $payload.t6_coordination_imported -or -not $payload.t7_export_center_imported -or -not $payload.t8_manufacturing_faces_imported) { throw 'Portable T6/T7/T8 layers missing' }
          if (-not $payload.upright_orbit_certified -or -not $payload.views_strip_certified -or -not $payload.measurement_foreground_certified) { throw 'Portable preview.2 interaction/rendering is not certified' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build V15 installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\CWS_Viewer_V15.iss
          if ($LASTEXITCODE -ne 0) { throw 'V15 installer build failed' }
          $setup = Get-ChildItem release_windows_v15 -Filter 'CWS_Viewer_Setup_1.4.0-v15-preview.2_x64.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'V15 preview.2 installer missing' }

      - name: Installed V15 gate without external Python
        shell: pwsh
        run: |
          $setup = Get-ChildItem release_windows_v15 -Filter 'CWS_Viewer_Setup_1.4.0-v15-preview.2_x64.exe' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'CWSViewerV15Installed'
          $install = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',("/DIR=$target")) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $target 'CWS_Viewer.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = Join-Path $env:EVIDENCE 'installed_v15_selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--v15-self-test') -Wait -PassThru -RedirectStandardOutput $out -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Installed V15 self-test failed' }
          $payload = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $payload.t5_review_workspace_imported -or -not $payload.t6_coordination_imported -or -not $payload.t7_export_center_imported -or -not $payload.t8_manufacturing_faces_imported) { throw 'Installed T5/T6/T7/T8 workspace missing' }
          if (-not $payload.trimble_style_handling_contract_certified -or -not $payload.selected_object_orbit_pivot_certified -or -not $payload.active_pivot_zoom_certified) { throw 'Installed selected-object handling is not certified' }
          if (-not $payload.upright_orbit_certified -or -not $payload.source_ifc_colours_certified -or -not $payload.contact_shading_certified -or -not $payload.selected_fill_highlight_certified -or -not $payload.views_strip_certified -or -not $payload.measurement_foreground_certified) { throw 'Installed preview.2 feature set is incomplete' }
          if ($payload.production_marking_released -or $payload.production_machine_transfer_allowed) { throw 'Installed preview unexpectedly enables production marking/machine transfer' }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (Test-Path $uninstaller) {
            $un = Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
            if ($un.ExitCode -ne 0) { throw 'V15 uninstall failed' }
          }

      - name: Build V15 release manifest and checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release_windows_v15 -File | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash=(Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release_windows_v15\SHA256SUMS.txt
          [ordered]@{
            version=$env:VIEWER_VERSION
            run_id=$env:GITHUB_RUN_ID
            commit=$env:GITHUB_SHA
            status='passed'
            workspace_schema='cws-viewer-workspace-15.2'
            v14_worker_transport_preserved=$true
            trimble_style_handling_contract_certified=$true
            selected_object_orbit_pivot_certified=$true
            active_pivot_zoom_certified=$true
            upright_orbit_certified=$true
            source_ifc_colours_certified=$true
            contact_shading_certified=$true
            selected_fill_highlight_certified=$true
            ctrl_multiselect_certified=$true
            bidirectional_list_selection_certified=$true
            assembly_part_level_certified=$true
            views_strip_certified=$true
            measurement_foreground_certified=$true
            t4_selection_measurement_certified=$true
            t5_review_workspace_certified=$true
            t6_coordination_certified=$true
            t7_export_center_certified=$true
            t8_manufacturing_faces_certified=$true
            marking_feature_development=$true
            production_marking_released=$false
            production_machine_transfer_allowed=$false
            parity_status='preview2_local_viewer_trimble_feel_v2'
            files=@($files | ForEach-Object {
              [ordered]@{name=$_.Name;bytes=$_.Length;sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()}
            })
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release_windows_v15\WINDOWS_VIEWER_V15_RELEASE_MANIFEST.json
          Get-Content release_windows_v15\SHA256SUMS.txt

      - name: Upload V15 installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.4.0-v15-preview.2_INSTALLER_x64
          path: |
            release_windows_v15/CWS_Viewer_Setup_1.4.0-v15-preview.2_x64.exe
            release_windows_v15/SHA256SUMS.txt
            release_windows_v15/WINDOWS_VIEWER_V15_RELEASE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V15 portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.4.0-v15-preview.2_PORTABLE_x64
          path: release_windows_v15/CWS_Viewer_Portable_1.4.0-v15-preview.2_x64.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_1.4.0-v15-preview.2_EVIDENCE
          path: |
            validation/standalone-viewer-v15/*.json
            validation/standalone-viewer-v15/*.png
            validation/standalone-viewer-v15/*.txt
          if-no-files-found: warn
          retention-days: 30
