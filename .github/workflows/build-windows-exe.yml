name: Build CWS Convertor Windows installer and portable package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.7-semantic-import
      - v0.8-codex-handover
    paths:
      - "*.py"
      - "*.json"
      - "cws_project/**"
      - "cws_convertor/**"
      - "project_tab.py"
      - "templates/**"
      - "installer/**"
      - "tests/**"
      - "validation/**"
      - "requirements*.txt"
      - "CWS_Convertor.spec"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      CWS_VERSION: 0.8.0-alpha-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock.txt
          python -m pip check

      - name: Compile and run safety regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m compileall -q .
          Get-ChildItem tests -Filter "*_smoke.py" |
            Sort-Object Name |
            ForEach-Object {
              python $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          python cli.py --version
          python cli.py pdf-analyze --help
          python cli.py project-new --help
          python cli.py project-import-baseline --help
          python cli.py project-import --help
          python cli.py project-tree --help
          python cli.py project-list-parts --help
          python cli.py project-migrate --help

      - name: Project CLI contract smoke
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "ci_project.cwscproj"
          python cli.py project-new $project --name "CI project" --client "CWS" --order "CI-001"
          python cli.py project-info $project --json
          if (-not (Test-Path $project)) { throw "CWS-projectbestand ontbreekt" }

      - name: GUI import smoke
        shell: pwsh
        run: |
          python -c "from app import ConverterApp; app=ConverterApp(); app.update_idletasks(); app.destroy(); print('GUI smoke OK')"

      - name: Build onedir GUI and CLI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CWS_Convertor.spec
          if (-not (Test-Path "dist/CWS_Convertor/CWS_Convertor.exe")) { throw "GUI EXE ontbreekt" }
          if (-not (Test-Path "dist/CWS_Convertor/CWS_Convertor_CLI.exe")) { throw "CLI EXE ontbreekt" }
          & "dist/CWS_Convertor/CWS_Convertor_CLI.exe" --version
          Compress-Archive -Path "dist/CWS_Convertor" -DestinationPath "dist/CWS_Convertor_Portable_${env:CWS_VERSION}_x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build one-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe niet gevonden" }
          & $iscc "installer/CWS_Convertor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build mislukt" }

      - name: Install and smoke-test without Python on PATH
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist_installer/CWS_Convertor_Setup_${env:CWS_VERSION}_x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "CWS_Convertor_Installed"
          $installProcess = Start-Process -FilePath $installer.Path `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") `
            -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            throw "Stille installatie mislukt met exitcode $($installProcess.ExitCode)"
          }
          $gui = Join-Path $installDir "CWS_Convertor.exe"
          $cli = Join-Path $installDir "CWS_Convertor_CLI.exe"
          if (-not (Test-Path $gui)) { throw "Geinstalleerde GUI EXE ontbreekt" }
          if (-not (Test-Path $cli)) { throw "Geinstalleerde CLI EXE ontbreekt" }

          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
            & $cli --version
            if ($LASTEXITCODE -ne 0) { throw "Geinstalleerde CLI --version faalde" }
            $project = Join-Path $env:RUNNER_TEMP "installed_smoke.cwscproj"
            & $cli project-new $project --name "Installed smoke"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $project)) { throw "Geinstalleerde projectopslag-smoke faalde" }
            & $cli project-info $project
            if ($LASTEXITCODE -ne 0) { throw "Geinstalleerde project-info-smoke faalde" }
          } finally {
            $env:PATH = $savedPath
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller ontbreekt" }
          $uninstallProcess = Start-Process -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Stille uninstall mislukt met exitcode $($uninstallProcess.ExitCode)"
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/CWS_Convertor_Portable_${env:CWS_VERSION}_x64.zip",
            "dist_installer/CWS_Convertor_Setup_${env:CWS_VERSION}_x64.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $files release/
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_0.8.0-alpha-dev_Windows_x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
