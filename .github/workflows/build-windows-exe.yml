name: Build SteelConverter Windows installer and portable package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.7-semantic-import
      - v0.8-codex-handover
    paths:
      - "*.py"
      - "*.json"
      - "cws_project/**"
      - "cws_convertor/**"
      - "cws_viewer/**"
      - "viewer_harness/**"
      - "project_tab.py"
      - "pyinstaller_hooks/**"
      - "templates/**"
      - "assets/**"
      - "installer/**"
      - "tests/**"
      - "validation/**"
      - "requirements*.txt"
      - "CWS_Convertor.spec"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      CWS_VERSION: 0.10.16-beta-dev
      RUNTIME_RESULTS: ${{ github.workspace }}\validation\results\windows-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock.txt
          python -m pip check

      - name: Compile and run source regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m compileall -q .
          python validation/run_all_smokes_v9.py `
            --headless-windows `
            --output "$env:RUNTIME_RESULTS\source-smokes"
          if ($LASTEXITCODE -ne 0) { throw "Source smoke suite faalde" }
          python cli.py --version
          python cli.py pdf-analyze --help
          python cli.py project-new --help
          python cli.py project-import-baseline --help
          python cli.py project-import --help
          python cli.py project-tree --help
          python cli.py project-list-parts --help
          python cli.py project-export-steel-model --help
          python cli.py project-rebuild-canonical --help
          python cli.py project-validate-roundtrips --help
          python cli.py project-export-parts --help
          python cli.py project-export-assemblies --help
          python cli.py project-migrate --help
          python validation/run_phase_b_viewer_ui.py `
            --output "$env:RUNTIME_RESULTS\source-phase-b-viewer-ui.json"
          python validation/run_phase_b_progressive_loading.py `
            --output "$env:RUNTIME_RESULTS\source-phase-b-progressive-loading.json"
          Write-Host "Native VTK/OCCT window rendering is exercised by local, dist, portable and installed gates."
          Write-Host "GitHub Actions uses the deterministic headless native pipeline gate."
          python tests/viewer_ci_headless_smoke.py
          python validation/run_viewer_v6_smoke_batch.py --timeout 360

      - name: Upload source smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-smoke-diagnostics-${{ github.run_id }}
          path: ${{ env.RUNTIME_RESULTS }}\source-smokes
          if-no-files-found: warn
          retention-days: 14

      - name: Source project contract smoke
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "ci_project.cwscproj"
          python cli.py project-new $project --name "CI project" --client "CWS" --order "CI-001"
          python cli.py project-info $project --json
          if (-not (Test-Path $project)) { throw "CWS-projectbestand ontbreekt" }

      - name: Source native runtime self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:RUNTIME_RESULTS -Force | Out-Null
          python CWS_Convertor_App.py --self-test --output "$env:RUNTIME_RESULTS\source-native-selftest.json"
          if ($LASTEXITCODE -ne 0) { throw "Source native self-test faalde" }

      - name: Source GUI smoke
        shell: pwsh
        run: |
          python CWS_Convertor_App.py --gui-smoke --output "$env:RUNTIME_RESULTS\source-gui-smoke.json"
          if ($LASTEXITCODE -ne 0) { throw "Source GUI-smoke faalde" }

      - name: Record core phase 0 baseline evidence
        shell: pwsh
        run: |
          python validation/run_core_phase0_baseline.py --skip-tests `
            --output "$env:RUNTIME_RESULTS\ci-core-phase0-baseline.json"
          if ($LASTEXITCODE -ne 0) { throw "Core phase 0 baseline faalde" }

      - name: Build onedir GUI and CLI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean CWS_Convertor.spec
          if (-not (Test-Path "dist/CWS_Convertor/CWS_Convertor.exe")) { throw "GUI EXE ontbreekt" }
          if (-not (Test-Path "dist/CWS_Convertor/CWS_Convertor_CLI.exe")) { throw "CLI EXE ontbreekt" }

      - name: Inspect packaged native dependencies
        shell: pwsh
        run: |
          python validation/inspect_windows_native_dependencies.py dist/CWS_Convertor `
            --output "$env:RUNTIME_RESULTS\dist-native-inventory.json"

      - name: PyInstaller dist native, GUI, CLI and conversion smoke
        shell: pwsh
        run: |
          python tests/packaged_runtime_smoke.py `
            --runtime-dir dist/CWS_Convertor `
            --label dist `
            --result-dir $env:RUNTIME_RESULTS

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/CWS_Convertor" `
            -DestinationPath "dist/CWS_Convertor_Portable_${env:CWS_VERSION}_x64.zip" -Force

      - name: Extract and test portable runtime
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "CWS_Convertor_Portable_Clean"
          if (Test-Path $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          Expand-Archive "dist/CWS_Convertor_Portable_${env:CWS_VERSION}_x64.zip" -DestinationPath $portableRoot
          $runtime = Join-Path $portableRoot "CWS_Convertor"
          python tests/packaged_runtime_smoke.py `
            --runtime-dir $runtime `
            --label portable `
            --result-dir $env:RUNTIME_RESULTS

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build one-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe niet gevonden" }
          & $iscc "installer/CWS_Convertor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build mislukt" }
          if (-not (Test-Path "dist_installer/CWS_Convertor_Setup_${env:CWS_VERSION}_x64.exe")) {
            throw "Installer ontbreekt"
          }

      - name: Install application silently
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist_installer/CWS_Convertor_Setup_${env:CWS_VERSION}_x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "CWS_Convertor_Installed"
          "CWS_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installProcess = Start-Process -FilePath $installer.Path `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/TASKS=fileassoc", "/DIR=$installDir") `
            -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            throw "Stille installatie mislukt met exitcode $($installProcess.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $installDir "CWS_Convertor.exe"))) { throw "Geinstalleerde GUI ontbreekt" }

      - name: Installed native, GUI, CLI, project and conversion smoke without Python on child PATH
        shell: pwsh
        run: |
          python tests/packaged_runtime_smoke.py `
            --runtime-dir $env:CWS_INSTALL_DIR `
            --label installed `
            --result-dir $env:RUNTIME_RESULTS
          python tests/windows_installer_association_smoke.py `
            --runtime-dir $env:CWS_INSTALL_DIR

      - name: Uninstall and verify removal
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:CWS_INSTALL_DIR "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller ontbreekt" }
          $uninstallProcess = Start-Process -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Stille uninstall mislukt met exitcode $($uninstallProcess.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $env:CWS_INSTALL_DIR "CWS_Convertor.exe")) {
            throw "GUI EXE bleef na uninstall achter"
          }
          if (Test-Path (Join-Path $env:CWS_INSTALL_DIR "CWS_Convertor_CLI.exe")) {
            throw "CLI EXE bleef na uninstall achter"
          }

      - name: Create checksums and validation evidence
        shell: pwsh
        run: |
          $files = @(
            "dist/CWS_Convertor_Portable_${env:CWS_VERSION}_x64.zip",
            "dist_installer/CWS_Convertor_Setup_${env:CWS_VERSION}_x64.exe"
          )
          $manifestFiles = foreach ($file in $files) {
            $item = Get-Item $file
            [ordered]@{
              name = $item.Name
              bytes = $item.Length
              sha256 = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
            }
          }
          $lines = $manifestFiles | ForEach-Object { "$($_.sha256)  $($_.name)" }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $files release/
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Copy-Item WINDOWS_RUNTIME_VALIDATION.md release/WINDOWS_RUNTIME_VALIDATION.md
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "`n## CI build evidence"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md ""
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- Run ID: $env:GITHUB_RUN_ID"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- Commit: $env:GITHUB_SHA"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- Dist runtime: passed"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- Extracted portable runtime: passed"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- Installed runtime without Python on child PATH: passed"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md ""
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "### Release files"
          Add-Content release/WINDOWS_RUNTIME_VALIDATION.md ""
          foreach ($file in $manifestFiles) {
            Add-Content release/WINDOWS_RUNTIME_VALIDATION.md "- $($file.name): $($file.bytes) bytes; SHA-256 $($file.sha256)"
          }
          $manifest = [ordered]@{
            version = $env:CWS_VERSION
            run_id = $env:GITHUB_RUN_ID
            commit = $env:GITHUB_SHA
            status = "passed"
            files = @($manifestFiles)
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 release/WINDOWS_RELEASE_MANIFEST.json
          Copy-Item "$env:RUNTIME_RESULTS\*.json" release/
          @(
            "## SteelConverter Windows release $env:CWS_VERSION",
            "",
            "Run: $env:GITHUB_RUN_ID  ",
            "Commit: ``$env:GITHUB_SHA``  ",
            "Runtime matrix: source, dist, fresh portable extraction and installed application passed.",
            "",
            "| File | Bytes | SHA-256 |",
            "| --- | ---: | --- |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($file in $manifestFiles) {
            "| $($file.name) | $($file.bytes) | ``$($file.sha256)`` |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          Get-Content release/SHA256SUMS.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_${{ env.CWS_VERSION }}_Windows_x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
