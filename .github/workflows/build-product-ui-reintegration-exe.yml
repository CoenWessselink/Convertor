name: CWS Convertor Phase 1 Canonical Product Core

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cws-product-ui-reintegration-v1
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-windows:
    name: Phase 1 source, GUI, dist and fresh portable
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: "1"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install locked build runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock.txt
          python -m pip check
          python -c "import cadquery,OCP,ifcopenshell,PySide6,vtk,fitz; print('native imports OK')"

      - name: Run Phase 1 source and GUI gates
        shell: pwsh
        run: python tools/run_phase1_unified_gates.py

      - name: Build reproducible Phase 1 evidence
        shell: pwsh
        run: python tools/build_phase1_reproducible_evidence.py

      - name: Build and prove Windows one-folder and fresh portable
        shell: pwsh
        run: python tools/build_phase1_windows_release.py

      - name: Capture exact-SHA repository and CI context
        shell: pwsh
        run: python tools/capture_phase1_repository_ci.py

      - name: Generate Phase 1 manifests
        shell: pwsh
        run: python tools/build_phase1_validation.py

      - name: Upload Phase 1 evidence and Windows deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Convertor_Phase1_${{ github.sha }}_Windows_x64
          path: |
            release/phase1/*
            validation/phases/PHASE_1_*.json
            validation/phases/PHASE_1_CHECKLIST.md
          if-no-files-found: error
          retention-days: 30
