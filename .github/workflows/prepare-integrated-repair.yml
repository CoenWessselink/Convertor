name: Verify reviewed integrated repair before packaging
on:
  push:
    branches: [agent/cws-integrated-gap-repair-20260909]
    paths: ['tools/integrated_repair.*', '.github/workflows/prepare-integrated-repair.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Verify original files and reproduce the reviewed patch
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd(); out=root/'build/integrated-preparation';out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args])
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=json.loads((root/'tools/integrated_repair.manifest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/f'tools/integrated_repair.payload.{i}').read_text().strip() for i in range(4))
          compressed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(compressed).hexdigest()!=manifest['compressed_sha256']:raise RuntimeError('Transport fingerprint mismatch')
          patch=lzma.decompress(compressed)
          if hashlib.sha256(patch).hexdigest()!=manifest['patch_sha256']:raise RuntimeError('Patch fingerprint mismatch')
          git('config','core.autocrlf','false')
          for row in manifest['files']:
              path=row['path']; target=root/path
              if pathlib.PurePosixPath(path).is_absolute() or '..' in pathlib.PurePosixPath(path).parts or target.is_symlink():raise RuntimeError('Unsafe path')
              existing=git('ls-tree','HEAD','--',path).decode().strip()
              if row['before'] is None:
                  if existing or target.exists():raise RuntimeError('Concurrent new source: '+path)
              else:
                  if not existing or existing.split('\t')[0].split()[-1]!=row['before']:raise RuntimeError('Concurrent source changed: '+path)
                  target.write_bytes(git('show','HEAD:'+path))
          patch_path=out/'reviewed.patch';patch_path.write_bytes(patch)
          git('apply','--check',str(patch_path));git('apply',str(patch_path))
          def amend(path,before,after,old,new):
              data=(root/path).read_bytes()
              if blob(data)!=before or data.count(old)!=1:raise RuntimeError('Unexpected source before amendment: '+path)
              data=data.replace(old,new)
              if blob(data)!=after:raise RuntimeError('Unexpected source after amendment: '+path)
              (root/path).write_bytes(data)
              next(row for row in manifest['files'] if row['path']==path)['sha']=after
          amend('tools/run_material_model_recognition_acceptance.py','8ff6cb1c59f21a977067290ca5b1bd40eff1b1fb','4036c2f55ef5a803d635f939cc2c8430d979e809',b'"pypdf", "numpy")',b'"pypdf", "numpy", "shapely")')
          old=b'            self._plan = job.result; self._show_plan()'
          new='\n'.join([
              '            # JobManager snapshots serialize dataclasses to plain dictionaries.',
              '            # Rehydrate and independently validate before exposing the proposal.',
              '            from cws_convertor.optimization.plate_nesting.canonical import PlateCutPlan, validate_canonical_plate_nesting',
              '            try:',
              '                plan = PlateCutPlan.from_dict(job.result) if isinstance(job.result, dict) else job.result',
              '                validation = validate_canonical_plate_nesting(plan, self._inputs.demands, self._inputs.stock, stock_boundaries=self._inputs.boundaries)',
              '                if not validation.passed and plan.complete:',
              "                    raise ValueError(', '.join(validation.blocking_codes))",
              '                self._plan = plan; self._show_plan()',
              '            except (ValueError, TypeError, KeyError, AttributeError) as exc:',
              '                self._plan = None',
              "                self.status.setText('Resultaat geblokkeerd: ' + str(exc))" ]).encode()
          amend('cws_convertor/ui_qt/v5_workspaces.py','1820ab154ade1beea4aa015b3a54f9be2407776d','558df0da6d67ea7ee8d1840a163102f0251ec44c',old,new)
          entries=[];blobs=[]
          for row in manifest['files']:
              data=(root/row['path']).read_bytes()
              if blob(data)!=row['sha']:raise RuntimeError('Result fingerprint mismatch: '+row['path'])
              if row['path'].endswith('.py'):compile(data,row['path'],'exec')
              entries.append({'path':row['path'],'mode':'100644','type':'blob','sha':row['sha']})
              blobs.append({'sha':row['sha'],'content':base64.b64encode(data).decode()})
          prepared={'parent':git('rev-parse','HEAD').decode().strip(),'base_tree':git('rev-parse','HEAD^{tree}').decode().strip(),'entries':entries,'blobs':blobs,'patch_sha256':manifest['patch_sha256'],'scope':'modified preparation worktree; not clean-source installer approval'}
          (out/'PREPARED.json').write_text(json.dumps(prepared),encoding='utf-8')
          print('Verified all',len(entries),'reviewed files')
      - name: Install native runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/restore_m18_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test complete native suite and actual Qt reservation workflow
        shell: python
        run: |
          import json,pathlib,subprocess,sys
          out=pathlib.Path('build/integrated-preparation')
          result=subprocess.run([sys.executable,'tools/run_material_model_recognition_acceptance.py','--require-native','--output',str(out/'acceptance')],timeout=600)
          if result.returncode:raise SystemExit(result.returncode)
          from cws_convertor.ui_qt.plate_nesting_evidence import run_plate_nesting_evidence
          result=run_plate_nesting_evidence(out/'plate-ui')
          if result['status']!='PASS' or len(result['checks'])<20:raise RuntimeError('Real Qt flow not accepted')
          print('Real Qt flow passed:',len(result['checks']))
      - name: Store verified Git file objects only; do not move branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const prepared=JSON.parse(fs.readFileSync('build/integrated-preparation/PREPARED.json','utf8'));
            if(prepared.parent!==context.sha)throw new Error('Wrong parent');
            for(const item of prepared.blobs){
              const r=await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,content:item.content,encoding:'base64'});
              if(r.data.sha!==item.sha)throw new Error('Uploaded blob mismatch');
            }
            delete prepared.blobs;
            prepared.run_id=context.runId;
            fs.writeFileSync('build/integrated-preparation/VERIFIED_FILES.json',JSON.stringify(prepared,null,2));
            core.info(JSON.stringify(prepared));
      - name: Upload preparation and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Integrated_Preparation_${{ github.sha }}
          path: |
            build/integrated-preparation/**
            !build/integrated-preparation/PREPARED.json
          if-no-files-found: error
          retention-days: 14
