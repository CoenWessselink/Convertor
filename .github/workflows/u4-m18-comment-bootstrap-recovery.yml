name: U4 M18 comment bootstrap recovery

on:
  push:
    branches:
      - feature/u4-m18-comment-bootstrap-recovery
  pull_request:
    branches:
      - feature/unified-u4-production-workflow-exe
    paths:
      - .github/workflows/u4-m18-comment-bootstrap-recovery.yml
      - tools/recover_m18_comment_bootstrap.py
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  TARGET_SHA256: 62c1a043a63dd0628769ad0e10d68afdf890406ca6f001cf354c2d6e84b94ae1
  TARGET_SIZE: "233402"
  RECOVERY_ROOT: recovery

jobs:
  recover:
    name: recover-exact-m18-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch complete PR 4 comment transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/4/comments?per_page=100" \
            > recovery/comments.json
          python - <<'PY'
          import json
          from pathlib import Path
          comments = json.loads(Path("recovery/comments.json").read_text(encoding="utf-8"))
          print(f"Fetched {len(comments)} comments")
          PY

      - name: Parse, verify and reconstruct bootstrap candidates
        shell: bash
        run: |
          set -euo pipefail
          python tools/recover_m18_comment_bootstrap.py

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f recovery/summary.md ]; then
            cat recovery/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload checksum-bound recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u4-m18-comment-bootstrap-recovery
          path: recovery/
          if-no-files-found: error
          retention-days: 3
