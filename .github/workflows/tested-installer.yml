name: Build and prove Windows installer
on:
  workflow_dispatch:
  push:
    branches: [agent/cws-recognition-bom-recovery-20260908]
    paths:
      - 'cws_convertor/**'
      - 'cws_viewer/**'
      - 'tests/**'
      - '*.py'
      - '*.spec'
      - 'installer/**'
      - 'pyinstaller_hooks/**'
      - 'requirements*.txt'
      - 'tools/build_tested_installer.py'
      - '.github/workflows/tested-installer.yml'
permissions:
  contents: read
concurrency:
  group: tested-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock.txt
            requirements-build.lock.txt
      - name: Install locked runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove strict recognition, material and BOM source
        shell: pwsh
        run: |
          python tools/run_material_model_recognition_acceptance.py --require-native --output build/material_model_recognition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove composed product source and GUI gates
        shell: pwsh
        run: |
          python tools/run_phase1_unified_gates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_native_runtime_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore checksum-bound native authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_m18_authority.py
      - name: Build exact-source native GUI and CLI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/installer_delivery/evidence | Out-Null
          python -m PyInstaller --clean --noconfirm CWS_Convertor.spec *> build/installer_delivery/evidence/pyinstaller.log
          $code = $LASTEXITCODE
          Get-Content build/installer_delivery/evidence/pyinstaller.log -Tail 80
          if ($code -ne 0) { exit $code }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test bundle, installation, conversion, reinstallation and removal
        run: python tools/build_tested_installer.py
      - name: Publish only tested installer
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Tested_Installer_${{ github.sha }}_Windows_x64
          path: |
            build/installer_delivery/*.exe
            build/installer_delivery/INSTALLER_ACCEPTANCE.json
            build/installer_delivery/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Installer_Diagnostics_${{ github.sha }}
          path: |
            build/installer_delivery/evidence/**
            build/installer_delivery/INSTALLER_ACCEPTANCE.json
            build/material_model_recognition/**
            build/evidence/m18_authority_restore.json
            validation/phases/PHASE_1_SOURCE_TEST_EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
  broad-source-regression:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 1, end: 60}
          - {start: 61, end: 120}
          - {start: 121, end: 180}
          - {start: 181, end: 999}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - name: Install native runtime
        run: python -m pip install -r requirements-runtime.lock.txt
      - name: Provide software OpenGL for runner-only render tests
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '23.3.3'
          build-type: 'release-msvc'
          deployment-choice: '1'
      - name: Restore checksum-bound authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/restore_m18_authority.py
      - name: Evaluate every source smoke in isolated processes
        run: python validation/run_all_smokes_v9.py --headless-windows --start ${{ matrix.start }} --end ${{ matrix.end }} --timeout 300 --output build/broad-source-${{ matrix.start }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Broad_Source_${{ matrix.start }}_${{ github.sha }}
          path: build/broad-source-${{ matrix.start }}/**
          if-no-files-found: error
          retention-days: 30
