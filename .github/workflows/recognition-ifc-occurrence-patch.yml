name: Recognition guarded IFC occurrence patch

on:
  push:
    branches: [agent/cws-recognition-native-integration-20260913]
    paths: [.github/workflows/recognition-ifc-occurrence-patch.yml]

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source/test patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('cws_convertor/importers/ifc_project.py')
          text = source.read_text(encoding='utf-8')
          old = '''    return SourceIdentity(\n        source_format="IFC",\n        source_file_id=source.source_id,\n        source_sha256=source.sha256,\n        source_entity_id=str(entity.entity_id),\n        global_id=entity.string(0),\n        part_position=part_position,\n        assembly_mark=assembly_mark,\n    )\n'''
          new = '''    global_id = entity.string(0)\n    return SourceIdentity(\n        source_format="IFC",\n        source_file_id=source.source_id,\n        source_sha256=source.sha256,\n        source_entity_id=str(entity.entity_id),\n        global_id=global_id,\n        # IFC products are physical occurrences. Preserve a deterministic\n        # occurrence identity instead of leaving this field empty: prefer the\n        # source GlobalId, and fall back to the source entity handle when a\n        # non-conforming export omits it. Source SHA keeps the fallback scoped\n        # to this exact revision.\n        occurrence_id=global_id or f"IFC#{entity.entity_id}",\n        part_position=part_position,\n        assembly_mark=assembly_mark,\n    )\n'''
          if old not in text:
              raise SystemExit('IFC source patch anchor missing or already changed; refusing broad edit')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/ifc_semantic_import_smoke.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''            weld = next(iter(session.project.welds.values()))\n            self.assertEqual(assembly.assembly_mark, "MLO4")\n'''
          replacement = '''            weld = next(iter(session.project.welds.values()))\n            materialised = (assembly, part, fastener, weld)\n            occurrence_ids = [item.source_identity.occurrence_id for item in materialised]\n            self.assertTrue(all(occurrence_ids))\n            self.assertEqual(len(set(occurrence_ids)), len(occurrence_ids))\n            self.assertEqual(part.source_identity.occurrence_id, "PART")\n\n            self.assertEqual(assembly.assembly_mark, "MLO4")\n'''
          if anchor not in text:
              raise SystemExit('IFC test patch anchor missing or already changed; refusing broad edit')
          test.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.ifc_semantic_import_smoke \
            tests.ifc_material_recognition_smoke \
            tests.manufacturing_material_evidence_safety_smoke -v
      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CWS Recognition CI'
          git config user.email 'actions@users.noreply.github.com'
          git add cws_convertor/importers/ifc_project.py tests/ifc_semantic_import_smoke.py
          git diff --cached --check
          git commit -m 'fix(ifc): preserve deterministic occurrence identity'
          git push origin HEAD:agent/cws-recognition-native-integration-20260913
