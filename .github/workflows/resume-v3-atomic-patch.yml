name: Prepare reviewed V3 resume repair without moving branch
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/resume-v3-atomic-patch.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve reviewed patch transport
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:'953ddf1cf8046247922cd3713778868202c7e510'})).data;
            // Correct one identified transport transcription, independently
            // reproduced locally. The decompressed SHA below is authoritative.
            const encoded=blob.content.replace(/\s/g,'').replace('kGI0mnoj8cWbj','kGI0mnoj8bj').replace(/=+$/,'');
            fs.writeFileSync('/tmp/cws-resume.patch.gz',Buffer.from(encoded,'base64'));
      - name: Verify baseline, exact patch and every resulting source file
        shell: python
        run: |
          import gzip,hashlib,json,pathlib,py_compile,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='7d64f2d4e77dcfffab99d60cfce85653f1ea45e6', 'Branch moved; rebase/review required'
          patch=gzip.decompress(pathlib.Path('/tmp/cws-resume.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='852c3d1133bd9f8852ba7de59c8c9d66e978f1c864f1c94f70e7e688c193dd00'
          path=pathlib.Path('/tmp/cws-resume.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected={
            'cws_viewer/ui_qt/vtk_real_project_widget.py':'6fbafb75fce19225229ebb7ee88084c48542527d4abc453ea37e74248b9a66c0',
            'cws_viewer/ui_qt/vtk_real_project_widget_feel_v2.py':'f1bd3505686d88798022e0533a83cfa9a444114d21036f172149784ee5fc31f9',
            'cws_viewer/ui_qt/vtk_real_project_widget_phase2.py':'16f014bc5aa0f747bccef90e2789082dc21c35866fa10c3b7527caf1faa2ae7d',
            'docs/PDF_UI_V3_NATIVE_INTEGRATION.md':'ca9ed4563b5f3358e650b103913ca4337b328cf23e41e08434d60f4b55f8ae0e',
            'docs/PDF_UI_V3_RESUME_20260911.md':'58c0ec44ba95e603d08378ca228d030e34be1760d4405577287ac3717d5bac16',
            'tests/viewer_native_initialization_smoke.py':'dc58103adb2fa138574b1bab983f446b44f0b261d105f3cb70ab8542a4edc929',
            'tools/run_full_product_acceptance.py':'7570a6bb72cb2c5967e4b3cbcadc0eab59a7d2ac8977c164c00fb52cf35e081c'
          }
          for name,digest in expected.items():
            p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
            if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/cws-resume-files.json').write_text(json.dumps(expected))
      - name: Store atomic commit object for explicit connected branch update
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');const repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/cws-resume-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data;
            const tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const data=fs.readFileSync(path);
              if(crypto.createHash('sha256').update(data).digest('hex')!==hash)throw new Error(path);
              const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            // The one-use transport workflow is not shipped in the repaired tree.
            tree.push({path:'.github/workflows/resume-v3-atomic-patch.yml',mode:'100644',type:'blob',sha:null});
            const createdTree=(await github.rest.git.createTree({...repo,base_tree:parent.tree.sha,tree})).data;
            const commit=(await github.rest.git.createCommit({...repo,message:'fix(ui-v3): guard native DPI initialization and exercise all new public drawing/PDF paths',tree:createdTree.sha,parents:[context.sha]})).data;
            fs.mkdirSync('prepared',{recursive:true});
            fs.writeFileSync('prepared/COMMIT.json',JSON.stringify({source_commit:commit.sha,source_tree:createdTree.sha,parent:context.sha,baseline:'7d64f2d4e77dcfffab99d60cfce85653f1ea45e6',files:expected,branch_updated:false,release_tests_passed:false,scope:'Hash-verified reviewed patch and syntax only; final Windows acceptance must run on this commit'},null,2));
            console.log('Prepared commit '+commit.sha+'; no branch ref moved');
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Reviewed_Resume_Commit
          path: prepared/COMMIT.json
          if-no-files-found: error
          retention-days: 30
