name: Prepare reviewed per-object export identity repair
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-artifact-identity-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),chunks=[];
            for(const sha of ['7bdf6c3363fb7f06e115a46b4d85f54e1545e4d8','30cb6e47f238c7799a0d8384cc73862703592970']){
              const b=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              const d=Buffer.from(b.content.replace(/\s/g,''),'base64');
              if(crypto.createHash('sha1').update(Buffer.from('blob '+d.length+'\0')).update(d).digest('hex')!==sha)throw new Error('Transport mismatch');
              chunks.push(d);
            }
            const data=Buffer.concat(chunks);
            if(data.length!==4600||crypto.createHash('sha256').update(data).digest('hex')!=='da992fded1bbaaa998436bc4d5e7cca94e6e64609a9c91a8263436a3a54a360f')throw new Error('Patch mismatch');
            fs.writeFileSync('/tmp/identity.patch.xz',data);
      - name: Verify reviewed baseline and source bytes
        shell: python
        run: |
          import hashlib,json,lzma,pathlib,py_compile,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='483fe1813967452dc7d83667150960e001adffda','Branch moved; review required'
          patch=lzma.decompress(pathlib.Path('/tmp/identity.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='796581c1e0c606a07a9c328556aee38e3f7f054334435597ce3f06ac101ba83b'
          p=pathlib.Path('/tmp/identity.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          expected={
            'cws_convertor/production_export/engine.py':'5a10ef454c70342bf0ba6a43fabff052825299f20c45d106734ba36f80a443c5',
            'cws_convertor/production_export/release.py':'d00db64676a66c6378bf56fd02d727daf0cfe3bf22be96341b3a64a3ebb6918b',
            'cws_convertor/production_export/verify.py':'68140707525d93ac4a0ac10a1a53f7db1c05e86e184c56fa14656893bee72bfb',
            'docs/BOM_EXPORT_GAP_REPAIR_20260911.md':'0ae04d4b5e412c7e736315cae27cc8f2c83d5067587ef1c286b80933c19e7549',
            'tests/bom_export_artifact_identity_smoke.py':'d9f0a96c498b3fa147ab778557b57aec7354313eccd792377afeda0175dd7519'
          }
          for name,digest in expected.items():
            p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
            if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/identity-files.json').write_text(json.dumps(expected))
      - name: Store exact reviewed source blobs without moving refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/identity-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data,tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const d=fs.readFileSync(path);if(crypto.createHash('sha256').update(d).digest('hex')!==hash)throw new Error(path);
              const b=(await github.rest.git.createBlob({...repo,content:d.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:b.sha});
            }
            tree.push({path:'.github/workflows/prepare-artifact-identity-repair.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'e0528c66ce8a946275f89095c1f6950440259427',tree,files:expected,branch_updated:false,release_tests_passed:false};
            fs.mkdirSync('prepared',{recursive:true});fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Artifact_Identity_Reviewed_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
