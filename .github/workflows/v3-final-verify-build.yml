name: Verify V3 source identity and start existing Windows installer
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-final-verify-build.yml']
permissions:
  contents: read
  actions: write
jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify reviewed source hashes and preserve exact source
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads(pathlib.Path('.github/v3-reviewed-patch/MANIFEST.json').read_text())
          for filename,expected in manifest['files'].items():
              data=pathlib.Path(filename).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,filename
              if filename.endswith('.py'): compile(data,filename,'exec')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip()
          out=pathlib.Path('build/v3-final-source');out.mkdir(parents=True,exist_ok=True)
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'source.zip'),'HEAD'],check=True)
          subprocess.run(['git','bundle','create',str(out/'source.bundle'),'HEAD'],check=True)
          (out/'COMMIT.txt').write_text(head+'\n')
          (out/'TREE.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True))
          (out/'VERIFICATION.json').write_text(json.dumps({'source_commit':head,'reviewed_files':manifest['files'],'all_file_hashes_verified':True,'external_v3_specification_verified':False},indent=2))
          (out/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256((out/name).read_bytes()).hexdigest()+'  '+name for name in ('source.zip','source.bundle'))+'\n')
      - name: Dispatch existing delivery workflow for this exact branch HEAD
        uses: actions/github-script@v7
        with:
          script: |
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const branch='agent/cws-pdf-ui-v3-complete-20260909';
            const ref=(await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data;
            if(ref.object.sha!==context.sha) throw new Error('Branch changed before installer dispatch');
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'installer-delivery.yml',ref:branch});
            core.notice('Existing integrated installer dispatched for '+context.sha);
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Reviewed_Final_Source_${{ github.sha }}
          path: build/v3-final-source/*
          retention-days: 14
          if-no-files-found: error
