name: CWS Viewer V15 T5 review workspace gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_viewer/**'
      - 'CWS_Viewer_V15_Standalone.py'
      - 'tests/viewer_v15_**'
      - '.github/workflows/viewer-v15-t5-review.yml'

permissions:
  contents: read

jobs:
  t5-contract:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile T5 modules
        shell: pwsh
        run: |
          python -m compileall -q `
            cws_viewer/review `
            cws_viewer/ui_qt/review_v15.py `
            cws_viewer/ui_qt/cockpit_t5_v15.py `
            cws_viewer/ui_qt/cockpit_progress_v15.py `
            CWS_Viewer_V15_Standalone.py
          if ($LASTEXITCODE -ne 0) { throw 'T5 compileall failed' }

      - name: Run T3 navigation no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_navigation_contract_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T3 regression failed' }

      - name: Run T4 selection measurement no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_selection_measurement_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T4 regression failed' }

      - name: Run deterministic T5 review contract
        shell: pwsh
        run: |
          python tests/viewer_v15_review_workspace_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T5 review workspace contract failed' }

      - name: Run V15 self-test contract
        shell: pwsh
        run: |
          python CWS_Viewer_V15_Standalone.py --v15-self-test
          if ($LASTEXITCODE -ne 0) { throw 'V15 T5 self-test failed' }
