name: Real file repair source snapshot
on:
  push:
    branches: [agent/cws-real-file-repair-20260909]
    paths: ['.github/workflows/real-file-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Archive immutable parent and exact file identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/real-file-source
          git archive --format=zip --output=build/real-file-source/source.zip 1d83feaca1bc9b9f21e0e7cdc69db0933b9e6008
          git ls-tree -r 1d83feaca1bc9b9f21e0e7cdc69db0933b9e6008 > build/real-file-source/FILES.txt
          git rev-parse 1d83feaca1bc9b9f21e0e7cdc69db0933b9e6008^{tree} > build/real-file-source/TREE.txt
          sha256sum build/real-file-source/source.zip > build/real-file-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Real_File_Source_${{ github.sha }}
          path: build/real-file-source/*
          if-no-files-found: error
          retention-days: 7
