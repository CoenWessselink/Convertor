name: Prepare reviewed installer follow-up
on:
  push:
    branches: [agent/cws-installer-patch-preparation]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python tools/prepare_installer_followup.py
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync('build/installer-followup/objects.json','utf8'));
            if(data.parent!==context.sha) throw new Error('Parent mismatch');
            for(const object of data.objects){
              const r=await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,encoding:'base64',content:object.content});
              if(r.data.sha!==object.sha) throw new Error('Blob SHA mismatch');
              delete object.content;
            }
            fs.writeFileSync('build/installer-followup/VERIFIED_FILES.json',JSON.stringify(data,null,2));
            core.info(JSON.stringify(data));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Installer_Followup_${{ github.sha }}
          path: build/installer-followup/VERIFIED_FILES.json
          retention-days: 7
