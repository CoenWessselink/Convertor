name: Preserve recovered native V3 main-window source
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-preserve-native-source.yml']
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Retrieve complete reviewed patch transport
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), chunks=[];
            for(const sha of ['62b7f7105c0eba252a3eeaf52630f93516b556c1','cccd8dc5c1c9d42cc5ba7a584804a48e5ab509f5','3c01a7fb5297a753d467c45002f7ac3e16e85d29','41af4ab33746b73ad994db84060051b8c54ee990']) {
              const b=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              chunks.push(Buffer.from(b.content.replace(/\s/g,''),'base64'));
            }
            fs.writeFileSync('reviewed-native-ui.xz',Buffer.concat(chunks));
      - name: Verify and commit scoped existing-application changes
        shell: python
        run: |
          import hashlib,lzma,pathlib,subprocess
          payload=pathlib.Path('reviewed-native-ui.xz').read_bytes()
          assert hashlib.sha256(payload).hexdigest()=='0d87822c3da402b1868ea15645365cc6a7a4d9a8fa32b82aa5ed50273a0a7bc1'
          patch=lzma.decompress(payload)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changed and all(p=='CWS_Convertor_App.py' or p.startswith('cws_convertor/') for p in changed)
          for filename in changed:
              if filename.endswith('.py'):compile(pathlib.Path(filename).read_bytes(),filename,'exec')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(ui): preserve native V3 layout, main router, PDF analysis and shared dimension actions; acceptance pending'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/cws-pdf-ui-v3-complete-20260909'],check=True)
          print('PRESERVED_SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Retain complete recoverable patch
        uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Actual_Native_Source_Patch
          path: reviewed-native-ui.xz
          retention-days: 30
