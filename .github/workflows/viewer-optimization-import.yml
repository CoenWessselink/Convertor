name: Viewer verified optimization checkpoint
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths:
      - .github/viewer-optimization-import.json
      - .github/workflows/viewer-optimization-import.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viewer-verified-optimization-import
  cancel-in-progress: false
jobs:
  import-tested-checkpoint:
    if: github.repository == 'CoenWessselink/Convertor' && github.ref == 'refs/heads/agent/cws-pdf-ui-v3-complete-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/cws-pdf-ui-v3-complete-20260909
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and verify immutable commit bundle
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync('.github/viewer-optimization-import.json', 'utf8'));
            const pieces = [];
            for (const part of manifest.parts) {
              const response = await github.rest.git.getBlob({...context.repo, file_sha:part.blob_sha});
              let encoded = response.data.content.replace(/\s/g, '');
              // Repair only the documented transport transcription before hashing.
              // No imported source is executed unless the exact original bundle matches.
              for (const [oldText, newText] of (part.encoded_replacements || [])) {
                if (encoded.split(oldText).length !== 2) throw new Error('Ambiguous transport repair');
                encoded = encoded.replace(oldText, newText);
              }
              if (part.encoded_last_character) {
                encoded = encoded.replace(/=+$/, '');
                encoded = encoded.slice(0, -1) + part.encoded_last_character;
              }
              const data = Buffer.from(encoded, 'base64');
              const blobHash = crypto.createHash('sha1').update(Buffer.from(`blob ${data.length}\0`)).update(data).digest('hex');
              if (blobHash !== part.decoded_git_blob_sha) throw new Error('Part integrity mismatch');
              pieces.push(data);
            }
            const bundle = Buffer.concat(pieces);
            if (crypto.createHash('sha256').update(bundle).digest('hex') !== manifest.bundle_sha256) throw new Error('Bundle SHA256 mismatch');
            fs.writeFileSync('/tmp/viewer-optimization.bundle', bundle);
            fs.writeFileSync('/tmp/viewer-import-manifest.json', JSON.stringify(manifest));
      - name: Merge against current remote without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint
          cp /tmp/viewer-import-manifest.json checkpoint/import_manifest.json
          BASE=$(python -c "import json; print(json.load(open('/tmp/viewer-import-manifest.json'))['base_commit'])")
          CANDIDATE=$(python -c "import json; print(json.load(open('/tmp/viewer-import-manifest.json'))['candidate_commit'])")
          git bundle verify /tmp/viewer-optimization.bundle
          git fetch /tmp/viewer-optimization.bundle HEAD:refs/viewer/optimization-candidate
          test "$(git rev-parse refs/viewer/optimization-candidate)" = "$CANDIDATE"
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          git fetch origin "$BRANCH"
          git checkout -B viewer-import-current FETCH_HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git config user.name 'CWS Viewer Optimization Build'
          git config user.email 'cws-viewer-build@users.noreply.github.com'
          git merge --no-ff --no-edit "$CANDIDATE" -m 'perf(viewer): integrate verified profiler and render scheduling checkpoint'
          # cProfile prints trailing blank lines. Normalize only its text copy;
          # raw timing JSON and the immutable imported commits remain unchanged.
          python -c "from pathlib import Path; p=Path('validation/viewer_optimization/baseline/selection_profile.txt'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n', encoding='utf-8')"
          git add validation/viewer_optimization/baseline/selection_profile.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(viewer): normalize profiler report trailing whitespace'
          fi
          git diff --check "$BASE"..HEAD
          git rev-parse HEAD > checkpoint/source_commit.txt
          git log "$BASE"..HEAD --format='%H %P %s' > checkpoint/commits.txt
      - name: Install isolated verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxcb-cursor0 libegl1 libopengl0
          python -m pip install 'numpy<3' pytest psutil Pillow 'lxml==6.0.1' 'PySide6==6.9.2' 'vtk==9.6.2'
          python -m pip freeze > checkpoint/runtime.txt
      - name: Verify real Qt scheduler and canonical selection regressions
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1680x1050x24' env QT_QPA_PLATFORM=xcb python -m pytest -q \
            tests/viewer_render_scheduler_smoke.py tests/viewer_runtime_profiler_smoke.py \
            tests/viewer_scheduler_native_smoke.py tests/viewer_native_initialization_smoke.py \
            tests/viewer_v15_selection_pivot_parity_smoke.py tests/viewer_v15_trimble_feel_v2_smoke.py \
            tests/viewer_v15_feel_fix_smoke.py tests/viewer_v2_core_controller_smoke.py \
            tests/bom_selection_identity_smoke.py --junitxml=checkpoint/tests.xml 2>&1 | tee checkpoint/tests.log
      - name: Publish only the tested merge using normal fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat checkpoint/source_commit.txt)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:"$BRANCH"
          BASE=$(python -c "import json; print(json.load(open('/tmp/viewer-import-manifest.json'))['base_commit'])")
          git bundle create checkpoint/source.bundle "$BASE"..HEAD
          sha256sum checkpoint/source.bundle > checkpoint/SHA256SUMS
          echo 'Native Linux software-renderer regression checkpoint only; Windows/GPU/performance targets remain unaccepted.' > checkpoint/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Viewer_Optimization_Checkpoint_${{ github.run_id }}
          path: checkpoint/*
          if-no-files-found: error
          retention-days: 30
