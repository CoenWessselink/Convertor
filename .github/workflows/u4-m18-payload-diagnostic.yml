name: U4 M18 payload transport diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-u4-production-workflow-v2
    paths:
      - '.github/workflows/u4-m18-payload-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect frozen payload without importing CWS
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, hashlib, io, zipfile
          root = Path('cws_convertor/manufacturing/m18_payload')
          files = sorted(root.glob('m18_authority_runtime.b64.*'))
          payload = b''.join(b''.join(p.read_bytes().split()) for p in files)
          print('chunk_count=', len(files))
          print('payload_len=', len(payload))
          print('payload_sha=', hashlib.sha256(payload).hexdigest())
          alphabet_no_pad = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/')
          alphabet_with_pad = alphabet_no_pad | {ord('=')}
          bad = [(i,b) for i,b in enumerate(payload) if b not in alphabet_with_pad]
          print('invalid_count=', len(bad))
          print('invalid_unique=', sorted(set(b for _,b in bad)))
          print('invalid_first=', bad[:20])
          clean = bytes(b for b in payload if b in alphabet_with_pad)
          print('clean_len=', len(clean), 'equals=', clean.count(b'='), 'first_equals=', clean.find(b'='), 'last_equals=', clean.rfind(b'='))
          try:
              decoded = base64.b64decode(clean, validate=True)
              print('WITH_PAD_OK', len(decoded), hashlib.sha256(decoded).hexdigest(), zipfile.is_zipfile(io.BytesIO(decoded)))
          except Exception as exc:
              print('WITH_PAD_ERROR', type(exc).__name__, str(exc))
          no_pad = bytes(b for b in payload if b in alphabet_no_pad)
          rebuilt = no_pad + b'=' * ((-len(no_pad)) % 4)
          print('rebuilt_len=', len(rebuilt), 'terminal_padding=', len(rebuilt)-len(no_pad))
          try:
              decoded = base64.b64decode(rebuilt, validate=True)
              print('REBUILT_PAD_OK', len(decoded), hashlib.sha256(decoded).hexdigest(), zipfile.is_zipfile(io.BytesIO(decoded)))
              if zipfile.is_zipfile(io.BytesIO(decoded)):
                  with zipfile.ZipFile(io.BytesIO(decoded)) as zf:
                      print('ZIP_TEST=', zf.testzip())
                      print('ZIP_MEMBERS=', len(zf.infolist()))
          except Exception as exc:
              print('REBUILT_PAD_ERROR', type(exc).__name__, str(exc))
          '@ | Set-Content -Encoding utf8 diagnostic.py
          python diagnostic.py
