name: U4 M18 payload transport diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-u4-production-workflow-v2
    paths:
      - '.github/workflows/u4-m18-payload-diagnostic.yml'
  pull_request:
    branches:
      - feature/unified-u3-central-ui
    paths:
      - '.github/workflows/u4-m18-payload-diagnostic.yml'
      - 'cws_convertor/manufacturing/authority.py'
      - 'cws_convertor/manufacturing/m18_payload/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect frozen payload without importing CWS
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, hashlib, io, zipfile
          root = Path('cws_convertor/manufacturing/m18_payload')
          files = sorted(root.glob('m18_authority_runtime.b64.*'))
          payload = b''.join(b''.join(p.read_bytes().split()) for p in files)
          print('chunk_count=', len(files))
          print('payload_len=', len(payload))
          print('payload_sha=', hashlib.sha256(payload).hexdigest())
          alphabet_no_pad = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/')
          alphabet_with_pad = alphabet_no_pad | {ord('=')}
          bad = [(i,b) for i,b in enumerate(payload) if b not in alphabet_with_pad]
          print('invalid_count=', len(bad), 'invalid_unique=', sorted(set(b for _,b in bad)), 'invalid_first=', bad[:20])
          decoded_parts = []
          for index, path in enumerate(files, 1):
              raw = b''.join(path.read_bytes().split())
              clean = bytes(b for b in raw if b in alphabet_with_pad)
              removed = len(raw) - len(clean)
              body = clean.rstrip(b'=')
              if b'=' in body:
                  raise RuntimeError(f'chunk {index} contains non-terminal padding')
              padded = body + b'=' * ((-len(body)) % 4)
              decoded = base64.b64decode(padded, validate=True)
              decoded_parts.append(decoded)
              print('CHUNK_OK', index, 'raw=', len(raw), 'removed=', removed, 'body=', len(body), 'pad=', len(padded)-len(body), 'decoded=', len(decoded), 'sha=', hashlib.sha256(decoded).hexdigest())
          runtime = b''.join(decoded_parts)
          print('CHUNKWISE_RUNTIME', len(runtime), hashlib.sha256(runtime).hexdigest(), zipfile.is_zipfile(io.BytesIO(runtime)))
          if zipfile.is_zipfile(io.BytesIO(runtime)):
              with zipfile.ZipFile(io.BytesIO(runtime)) as zf:
                  print('ZIP_TEST=', zf.testzip())
                  print('ZIP_MEMBERS=', len(zf.infolist()))
          '@ | Set-Content -Encoding utf8 diagnostic.py
          python diagnostic.py
