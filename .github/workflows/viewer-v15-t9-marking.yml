name: CWS Viewer V15 T9 M3 scribing gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_convertor/manufacturing/marking.py'
      - 'cws_convertor/manufacturing/marking_model.py'
      - 'cws_convertor/manufacturing/__init__.py'
      - 'tests/viewer_v15_marking_smoke.py'
      - '.github/workflows/viewer-v15-t9-marking.yml'

permissions:
  contents: read

jobs:
  m3-scribing-contract:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile M3 marking modules
        shell: pwsh
        run: |
          python -m compileall -q cws_convertor/manufacturing/marking_model.py cws_convertor/manufacturing/marking.py tests/viewer_v15_marking_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M3 compileall failed' }

      - name: Run T8 no-regression
        shell: pwsh
        run: |
          python tests/manufacturing_face_core_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'ManufacturingFace regression failed' }
          python tests/manufacturing_contact_core_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'ContactPatch regression failed' }

      - name: Run deterministic M3 scribing contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation\viewer-v15-t9 | Out-Null
          python tests/viewer_v15_marking_smoke.py 2>&1 | Tee-Object validation\viewer-v15-t9\m3_scribing.txt
          if ($LASTEXITCODE -ne 0) { throw 'M3 scribing contract failed' }

      - name: Upload M3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_V15_M3_scribing_diagnostics
          path: validation/viewer-v15-t9/*
          if-no-files-found: warn
          retention-days: 14
