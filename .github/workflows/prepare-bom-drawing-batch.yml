name: Prepare reviewed native BOM drawing batch
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-bom-drawing-batch.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve reviewed batch patch without rewriting current source
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),chunks=[];
            for(const sha of ['35df13a3ea3ad604a6242b943897105920c8071f','546f38188c0024b3f52281c2b4e950df284e5cc1','82c720319f58a782fb989d347d1933324f765254','ea585599d1ff223585a5b4f082d56ea2908c3f96']){
              const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              const data=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              if(crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex')!==sha)throw new Error('Transport mismatch '+sha);
              chunks.push(data);
            }
            const data=Buffer.concat(chunks);
            if(data.length!==19392||crypto.createHash('sha256').update(data).digest('hex')!=='34fb5efd51818078fd5559253c19b587b38948f15da176d18e844f73135a81ce')throw new Error('Reviewed patch mismatch');
            fs.writeFileSync('/tmp/drawing-batch.patch.xz',data);
      - name: Preserve concurrent repairs and verify exact merged source
        shell: python
        run: |
          import hashlib,json,lzma,pathlib,py_compile,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='21e1b56fc77591a438e9695c2b1a8d7fe5d42c4f','Branch moved; re-review required'
          patch=lzma.decompress(pathlib.Path('/tmp/drawing-batch.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='4896dff0d52c2fd6b9efe7578004d2050eb4bde63e84151a0bbde6a773885f77'
          path=pathlib.Path('/tmp/drawing-batch.patch');path.write_bytes(patch)
          # The current upstream scale fix is independently tested and retained.
          # Do not overwrite it with the earlier local alternative in transport.
          options=['--exclude=pdf_support.py','--exclude=tests/review_workflow_smoke.py']
          subprocess.run(['git','apply','--check',*options,str(path)],check=True)
          subprocess.run(['git','apply',*options,str(path)],check=True)
          doc=pathlib.Path('docs/BOM_DRAWING_BATCH_REPAIR_20260911.md')
          text=doc.read_text()
          old='`agent/cws-pdf-ui-v3-complete-20260909`. Geen oudere UI-branch overgenomen,\ngeen vervangende applicatie of tweede tekenengine gemaakt.'
          new='`agent/cws-pdf-ui-v3-complete-20260909`. Vóór de push bleek de branch\ndoorgeschoven naar `21e1b56fc77591a438e9695c2b1a8d7fe5d42c4f`.\nAlle acht tussenliggende commits, waaronder artifact-identiteit, exacte\nreviewexports, hun geïnstalleerde bewijsgates en de invoerschaalreparatie,\nzijn behouden. De batchwijziging is daarop zonder conflicten toegepast\nen opnieuw getest. Geen oudere UI-branch overgenomen, geen vervangende\napplicatie of tweede tekenengine gemaakt.'
          assert text.count(old)==1;text=text.replace(old,new)
          old='De invoerschaal blijft nu expliciete broninformatie. Nieuwe review-uitvoer\ngebruikt Auto, tenzij een nieuwe uitvoerschaal expliciet is opgegeven via\n`DrawingTemplate.scale`. Een werkelijk opgegeven, niet-passende vaste schaal\nblijft een fout. De ingelezen review wordt niet opnieuw geanalyseerd of\ngemuteerd; een gewijzigde bron-PDF na goedkeuring blokkeert de export.'
          new='De lokale correctie is niet over de gelijktijdige upstream-reparatie gelegd.\nDe behouden implementatie van `21e1b56f` slaat de invoerschaal op onder\n`properties.source_drawing` en begint nieuwe review-uitvoer met Auto.\nExpliciete menselijke wijzigingen aan `drawing.scale` blijven strikt;\neen niet-passende vaste uitvoerschaal blijft een fout. De bijbehorende\nupstream-provenance- en fysieke-schaaltests blijven ongewijzigd behouden.'
          assert text.count(old)==1;doc.write_text(text.replace(old,new))
          expected={
            'cws_convertor/bom/production_hub.py':'eb8ce7422e7be775f46e1ae3937231f7a970045f9f73cdc4bb35e97d09fbd696',
            'cws_convertor/drawings/batch.py':'582915b63c81ffc1ea1b38af34e5e9dee1318a1869d88ece6de52482d9f2ff2f',
            'cws_convertor/ui_qt/bom_action_dispatch.py':'6f167a7a41b2c39e464a2d8b607e08a81acc090beada223ae1b9ddf1a3b83a40',
            'cws_convertor/ui_qt/bom_drawing_batch.py':'1c30fb6646afffd542ed75f1a3a2043408117d225a8212309e98105fa31f3442',
            'cws_convertor/ui_qt/bom_workspace.py':'aedbe1280204d0f525e125fb4c8f055aad141daa2035188513bc81bd341b0213',
            'cws_convertor/ui_qt/engineering_drawing.py':'8d8ceb29836534e9c8476772b4f7a592ab44428470aed59cd152d3f0c9b91234',
            'cws_convertor/ui_qt/pdf_ui_v3_evidence.py':'33c29eaf165ff789f72f58eb9d5b5af483c9317dff6a756d622ecd269b300ce5',
            'docs/BOM_DRAWING_BATCH_REPAIR_20260911.md':'f9ab206bb3eac6a11b6265270d371e4e095b3050eca2009327a73e81d637e244',
            'tests/bom_color_queue_smoke.py':'b244ddcc9ed5a8fc634b45b30afdfa6b368bbd4467ea1c92770ea7f50852bdc6',
            'tests/bom_drawing_batch_smoke.py':'dd0a3fed3312e6cf98be6ef73319bc203301f064b3312f418c6194077e3d1aca',
            'tests/bom_scope_safety_smoke.py':'c46817ed163f0eaf7433c455e0a2f25ece0e2123abd7c2f1e62962f61ee789aa',
            'tests/ui_v3_delivery_paths_smoke.py':'a041c1acbd52577e082f70e8c65be7655b0c8a5303f82af387977101a44f90d0',
            'tools/finalize_ui_v3_delivery.py':'0e1288b56431b1aa2b2f4f3604ac71ecede014fe689a277becbce59c13cce3a7'
          }
          for name,digest in expected.items():
              p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
              if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/drawing-batch-files.json').write_text(json.dumps(expected))
      - name: Store reviewed source blobs for explicit connected commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/drawing-batch-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data,tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const data=fs.readFileSync(path);
              if(crypto.createHash('sha256').update(data).digest('hex')!==hash)throw new Error(path);
              const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            tree.push({path:'.github/workflows/prepare-bom-drawing-batch.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'2748d21586f78cafde702396606ee28dcc6d8074',tree,files:expected,branch_updated:false,release_tests_passed:false,scope:'Hash-verified reviewed batch source only; all concurrent export repairs retained. Final exact-source Windows and installed tests still required.'};
            fs.mkdirSync('prepared',{recursive:true});fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Drawing_Batch_Reviewed_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
