name: Prepare exact runtime repairs
on:
  push:
    branches: [agent/cws-recognition-bom-recovery-20260908]
    paths: ['.github/workflows/prepare-runtime-repairs.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce reviewed file hashes
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess
          root=pathlib.Path.cwd()
          out=root/'build/runtime-repairs'
          out.mkdir(parents=True, exist_ok=True)
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          edits=json.loads((root/'tools/installer_runtime_repairs.json').read_text())
          marker='    SuiteSpec("tests/material_model_acceptance_runner_smoke.py", "acceptance_integrity"),'
          edits.append({'path':'tools/run_material_model_recognition_acceptance.py',
                        'before':'84e8418b1858b4144df6494310a2ad609de3fa81',
                        'after':'5c79b9e699ad4c4b80816208f479f804279ce3dd',
                        'replacements':[[marker,'    SuiteSpec("tests/assembly_material_binding_smoke.py", "assembly_material_safety", ("cadquery", "ifcopenshell")),\n    SuiteSpec("tests/source_smoke_status_smoke.py", "acceptance_integrity"),\n'+marker,1]]})
          files=[]
          for edit in edits:
              path=edit['path']
              if '..' in pathlib.PurePosixPath(path).parts or pathlib.PurePosixPath(path).is_absolute():
                  raise RuntimeError('Invalid path')
              data=subprocess.check_output(['git','show','HEAD:'+path])
              if sha(data)!=edit['before']:
                  raise RuntimeError('Concurrent source change: '+path)
              text=data.decode('utf-8')
              for old,new,count in edit['replacements']:
                  if text.count(old)!=count:
                      raise RuntimeError('Ambiguous replacement: '+path)
                  text=text.replace(old,new)
              data=text.encode('utf-8')
              if sha(data)!=edit['after']:
                  raise RuntimeError('Result differs from reviewed local source: '+path)
              compile(data,path,'exec')
              files.append({'path':path,'sha':sha(data),'content':base64.b64encode(data).decode('ascii')})
          result={'parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'files':files}
          (out/'PREPARED.json').write_text(json.dumps(result),encoding='utf-8')
      - name: Store verified blobs only without moving refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync('build/runtime-repairs/PREPARED.json','utf8'));
            for(const file of data.files) {
              const response=await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,content:file.content,encoding:'base64'});
              if(response.data.sha!==file.sha) throw new Error('Blob mismatch');
              delete file.content;
            }
            fs.writeFileSync('build/runtime-repairs/VERIFIED.json',JSON.stringify(data,null,2));
            core.info(JSON.stringify(data));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Verified_Runtime_Repairs_${{ github.sha }}
          path: build/runtime-repairs/VERIFIED.json
          if-no-files-found: error
          retention-days: 14
