name: Prepare installer recovery source
on:
  push:
    branches: [agent/cws-recognition-bom-recovery-20260908]
    paths: ['.github/workflows/prepare-installer-recovery.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies used by canonical release checks
        run: python -m pip install PyMuPDF==1.26.7 pypdf==5.9.0 reportlab==4.4.9 XlsxWriter==3.2.9 numpy==2.3.5 lxml==6.1.1
      - name: Verify reviewed repair
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          out = root / 'build/installer-recovery'
          out.mkdir(parents=True, exist_ok=True)
          path = root / 'cws_convertor/bom/production_hub.py'
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          data = path.read_bytes()
          if blob(data) != '104030f141516ce041f16506535018117a09ecec':
              raise RuntimeError('Source changed; refusing repair')
          before = subprocess.run([sys.executable, 'tests/bom_undo_refresh_smoke.py'], capture_output=True, text=True)
          (out/'before.log').write_text(before.stdout+before.stderr, encoding='utf-8')
          if before.returncode == 0 or 'Undo is geblokkeerd omdat de projectinhoud' not in before.stderr:
              raise RuntimeError('Original defect not reproduced')
          s = data.decode('utf-8')
          edits = [
              ('def _transaction_payload(project: Any) -> dict[str, Any]:', 'def _transaction_payload(project: Any, *, include_bom_cache: bool = False) -> dict[str, Any]:'),
              ('    if isinstance(settings, dict):\n        hub = settings.get(HUB_SETTINGS_KEY)', '    if isinstance(settings, dict):\n        # BOM snapshots are derived read caches, not user-authored project state.\n        # A refresh changes timestamps (and can refresh pre-edit quantities).\n        if not include_bom_cache:\n            settings.pop("bom", None)\n        hub = settings.get(HUB_SETTINGS_KEY)'),
              ('"undo_schema": "cws-bom-persistent-undo-2.0"', '"undo_schema": "cws-bom-persistent-undo-2.1"'),
              ('            actual = stable_sha256(_transaction_payload(self.project))', '            actual = stable_sha256(_transaction_payload(\n                self.project, include_bom_cache=(\n                    record.get("undo_schema") != "cws-bom-persistent-undo-2.1"\n                ),\n            ))'),
              ('            restored = type(self.project).from_dict(payload)\n', '            # Never leave the derived pre-undo cache attached to restored parts.\n            payload.get("settings", {}).pop("bom", None)\n            restored = type(self.project).from_dict(payload)\n'),
          ]
          for old,new in edits:
              if s.count(old) != 1:
                  raise RuntimeError('Ambiguous repair target')
              s = s.replace(old,new)
          data = s.encode('utf-8')
          if blob(data) != '470febb5b006e170ecf186edb6f41753d6b45efc':
              raise RuntimeError('Repair hash mismatch')
          path.write_bytes(data)
          after = subprocess.run([sys.executable, 'tests/bom_undo_refresh_smoke.py'], capture_output=True, text=True)
          (out/'after.log').write_text(after.stdout+after.stderr, encoding='utf-8')
          if after.returncode or 'Ran 6 tests' not in after.stderr or 'skipped=' in after.stderr:
              raise RuntimeError('Repair tests not passed')
          additional = [
              ('tests/phase1_phase2_completion_smoke.py', 'c843f44c3e30759056bf963c006c4af9f924701e', '4fe14222d22230a7a31cccb350f53a63ed8e2057', '            profile="PL10",\n            profile_confidence=1.0,', '            profile="PL10",\n            material="S355J2",\n            material_grade="S355J2",\n            profile_confidence=1.0,'),
              ('tools/run_material_model_recognition_acceptance.py', 'e154227538f3689286cdb163fb12d288a5e68233', '84e8418b1858b4144df6494310a2ad609de3fa81', '    SuiteSpec("tests/material_model_acceptance_runner_smoke.py", "acceptance_integrity"),', '    SuiteSpec("tests/bom_undo_refresh_smoke.py", "bom_undo_integrity"),\n    SuiteSpec("tests/material_model_acceptance_runner_smoke.py", "acceptance_integrity"),'),
          ]
          paths = ['cws_convertor/bom/production_hub.py']
          for name, original, expected, old, new in additional:
              p = root/name
              data = p.read_bytes()
              if blob(data) != original or data.decode('utf-8').count(old) != 1:
                  raise RuntimeError('Concurrent source change: '+name)
              data = data.decode('utf-8').replace(old,new).encode('utf-8')
              if blob(data) != expected:
                  raise RuntimeError('Output hash mismatch: '+name)
              p.write_bytes(data)
              paths.append(name)
          entries = []
          for name in paths:
              data = (root/name).read_bytes()
              compile(data, name, 'exec')
              entries.append({'path':name,'sha':blob(data),'content':base64.b64encode(data).decode('ascii')})
          result = {'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
                    'entries':entries}
          (out/'prepared.json').write_text(json.dumps(result), encoding='utf-8')
      - name: Store repaired file objects; do not move refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build/installer-recovery/prepared.json','utf8'));
            for(const file of data.entries) {
              const result = await github.rest.git.createBlob({owner:context.repo.owner,repo:context.repo.repo,content:file.content,encoding:'base64'});
              if(result.data.sha !== file.sha) throw new Error('Git blob hash mismatch');
              delete file.content;
            }
            fs.writeFileSync('build/installer-recovery/VERIFIED.json',JSON.stringify(data,null,2));
            core.info(JSON.stringify(data));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Installer_Recovery_Repair_${{ github.sha }}
          path: |
            build/installer-recovery/*.log
            build/installer-recovery/VERIFIED.json
          if-no-files-found: error
          retention-days: 14
