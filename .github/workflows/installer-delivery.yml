name: Integrated gap repair - tested beta installer
on:
  workflow_dispatch:
  push:
    branches: [agent/cws-integrated-gap-repair-20260909]
permissions:
  contents: read
concurrency:
  group: installer-delivery-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}
  QT_QPA_PLATFORM: offscreen
  CWS_HEADLESS_GUI_SMOKE: '1'
  GALLIUM_DRIVER: llvmpipe
  LIBGL_ALWAYS_SOFTWARE: '1'
jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Install native runtime
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/restore_m18_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict recognition and BOM acceptance
        run: python tools/run_material_model_recognition_acceptance.py --require-native --output build/material_model_recognition
      - name: Source and GUI integration
        if: ${{ !cancelled() }}
        run: python tools/run_phase1_unified_gates.py
      - name: Manufacturing and nesting integration
        if: ${{ !cancelled() }}
        run: python tools/run_phase2_unified_gates.py
      - name: PDF dimensioning
        if: ${{ !cancelled() }}
        run: python tools/run_pdf12_v2_tests.py --output build/pdf12-source.json
      - name: Capture real BOM controls
        if: ${{ !cancelled() }}
        run: python tools/capture_bom_production_hub.py --project "validation/master_completion/hvpc_project/HVPC te Hengelo fasen totaal.cwscproj" --output build/material_model_recognition/bom-screenshots
      - name: Require source-bound recognition usefulness before promotion
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          out=pathlib.Path('build/recognition-usefulness'); out.mkdir(parents=True,exist_ok=True)
          with (out/'corpus.log').open('w',encoding='utf-8') as log:
              result=subprocess.run([sys.executable,'tools/build_mgi_v3_acceptance_corpus.py','--output',str(out)],stdout=log,stderr=subprocess.STDOUT,timeout=300)
          (out/'EXECUTION.json').write_text(json.dumps({'exit_code':result.returncode,'full_product_release_approved':False,'scope':'required synthetic recognition acceptance; not supplier or machine qualification'}),encoding='utf-8')
          raise SystemExit(result.returncode)
      - name: Capture resolved dependencies and declared license metadata
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import importlib.metadata as m,json,pathlib,subprocess
          rows=[{'name':d.metadata.get('Name'),'version':d.version,'license':d.metadata.get('License-Expression') or d.metadata.get('License') or 'UNKNOWN'} for d in m.distributions()]
          pathlib.Path('build/RESOLVED_DEPENDENCIES.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'packages':sorted(rows,key=lambda d:(d['name'] or '').lower()),'vulnerability_scan_performed':False,'license_approval':False},indent=2),encoding='utf-8')
      - name: Upload exact-source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Installer_Core_${{ github.sha }}
          path: |
            build/material_model_recognition/**
            build/pdf12-source.json
            build/recognition-usefulness/*.json
            build/recognition-usefulness/*.log
            build/RESOLVED_DEPENDENCIES.json
            validation/phases/PHASE_*_EVIDENCE.json
          retention-days: 30
  broad:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Install native runtime
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/restore_m18_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '23.3.3'
          build-type: 'release-msvc'
          deployment-choice: '1'
      - name: Run a complete disjoint source-regression shard
        shell: python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          import importlib.util, math, os, pathlib, subprocess, sys
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location('smoke_runner',root/'validation/run_all_smokes_v9.py')
          runner=importlib.util.module_from_spec(spec); spec.loader.exec_module(runner)
          scripts=sorted(p for p in (root/'tests').glob('*_smoke.py') if not p.name.startswith('full_acceptance_') and p.name not in runner.SOURCE_SMOKE_EXCLUSIONS)
          size=math.ceil(len(scripts)/4); index=int(os.environ['SHARD'])
          result=subprocess.run([sys.executable,'validation/run_all_smokes_v9.py','--headless-windows','--timeout','300','--start',str(index*size+1),'--end',str(min(len(scripts),(index+1)*size)),'--output',f'build/source-shard-{index}'])
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Installer_Regression_${{ matrix.shard }}_${{ github.sha }}
          path: |
            build/source-shard-${{ matrix.shard }}/*.json
            build/source-shard-${{ matrix.shard }}/logs/*
          retention-days: 30
  installer:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - name: Install locked build tools and M18 payload
        run: |
          python -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/restore_m18_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '23.3.3'
          build-type: 'release-msvc'
          deployment-choice: '1'
      - name: Build installer and test installed runtime and uninstall
        run: python tools/build_tested_installer.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CWS_Installer_Candidate_${{ github.sha }}_Windows_x64
          path: release/installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CWS_Installer_Runtime_Proof_${{ github.sha }}
          path: build/installer-evidence/**
          if-no-files-found: error
          retention-days: 30
  promote:
    name: Joint exact-source beta promotion
    needs: [core, broad, installer]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CWS_Installer_Candidate_${{ github.sha }}_Windows_x64
          path: build/promotion
      - uses: actions/download-artifact@v4
        with:
          pattern: CWS_Installer_Core_${{ github.sha }}
          path: build/promotion
      - uses: actions/download-artifact@v4
        with:
          pattern: CWS_Installer_Regression_*_${{ github.sha }}
          path: build/promotion
      - name: Verify all required jobs and source/binary evidence
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROAD_RESULT: ${{ needs.broad.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
        shell: python
        run: |
          import json,os,subprocess,sys
          jobs={key:os.environ[key.upper()+'_RESULT'] for key in ('core','broad','installer')}
          subprocess.run([sys.executable,'tools/verify_integrated_delivery.py','--root','build/promotion','--sha',os.environ['GITHUB_SHA'],'--jobs',json.dumps(jobs)],check=True)
      - name: Retain scope, audit register and exact-source proof
        shell: python
        run: |
          import json,pathlib,shutil,zipfile
          root=pathlib.Path('build/promotion');out=root/'promoted'
          for name in ('INTEGRATED_GAP_REPAIR.md','INTEGRATED_GAP_REPAIR_REGISTER.json'):
              shutil.copyfile(pathlib.Path('docs')/name,out/name)
          with zipfile.ZipFile(out/'SOURCE_ACCEPTANCE_PROOF.zip','w',zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if path.is_file() and 'promoted' not in path.parts and path.suffix.lower() not in {'.exe','.dll','.ttf','.otf','.woff','.woff2'}:
                      z.write(path,path.relative_to(root))
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Integrated_Tested_Installer_${{ github.sha }}_Windows_x64
          path: build/promotion/promoted/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable commit-bound software beta
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const root='build/promotion/promoted';
            const proof=JSON.parse(fs.readFileSync(root+'/PROMOTION.json','utf8'));
            if(proof.status!=='PASS'||proof.source_commit!==context.sha||proof.full_product_release_approved!==false) throw new Error('Promotion binding invalid');
            const tag='cws-gap-beta-'+context.sha.slice(0,12);
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            let release;
            try {release=(await github.rest.repos.getReleaseByTag({...repo,tag})).data;}
            catch(error) {
              if(error.status!==404)throw error;
              const body=['Tested Windows x64 software beta. Source: '+context.sha,
                'Joint core, broad regression and installed-runtime acceptance passed. Real installed plate planning/reservation/reopen and same-version reinstall are tested.',
                'NOT full product or machine qualification. Broad manufacturing recognition, target hardware, certificates and signing remain separate limitations. Read INTEGRATED_GAP_REPAIR.md and the 36-item register. No machine transfer is authorized.'].join('\n\n');
              release=(await github.rest.repos.createRelease({...repo,tag_name:tag,target_commitish:context.sha,name:'CWS Convertor integrated gap repair '+context.sha.slice(0,8),prerelease:true,draft:false,body})).data;
            }
            if(release.target_commitish!==context.sha)throw new Error('Existing release points to a different source');
            const existing=(await github.rest.repos.listReleaseAssets({...repo,release_id:release.id,per_page:100})).data;
            for(const name of fs.readdirSync(root)) {
              const data=fs.readFileSync(root+'/'+name); const old=existing.find(a=>a.name===name);
              if(old) {
                const hash='sha256:'+require('crypto').createHash('sha256').update(data).digest('hex');
                if(old.digest!==hash)throw new Error('Refusing to overwrite differing release asset: '+name);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({...repo,release_id:release.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            core.info('Published '+release.html_url);
