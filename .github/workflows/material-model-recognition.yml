name: Material and model recognition acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact committed source to check out and test
        required: true
        type: string
  pull_request:
    paths:
      - 'cws_convertor/**'
      - 'material_database.py'
      - 'materials.json'
      - 'quantities.py'
      - 'pdf_support.py'
      - 'project_intake.py'
      - 'cli.py'
      - 'app.py'
      - 'conversion.py'
      - 'converter.py'
      - 'profile_database.py'
      - 'profiles.json'
      - 'canonical_model.py'
      - 'ifc_support.py'
      - 'ifc_native.py'
      - 'cws_viewer/**'
      - 'tests/**'
      - 'tools/run_material_model_recognition_acceptance.py'
      - 'requirements-runtime.lock.txt'
      - '.github/workflows/material-model-recognition.yml'
  push:
    branches: [agent/cws-product-ui-reintegration-v1, agent/cws-recognition-bom-recovery-20260908, agent/cws-recognition-geometry-intelligence-20260913]
    paths:
      - 'cws_convertor/**'
      - 'material_database.py'
      - 'materials.json'
      - 'quantities.py'
      - 'pdf_support.py'
      - 'project_intake.py'
      - 'cli.py'
      - 'app.py'
      - 'conversion.py'
      - 'converter.py'
      - 'profile_database.py'
      - 'profiles.json'
      - 'canonical_model.py'
      - 'ifc_support.py'
      - 'ifc_native.py'
      - 'cws_viewer/**'
      - 'tests/**'
      - 'tools/run_material_model_recognition_acceptance.py'
      - 'requirements-runtime.lock.txt'
      - '.github/workflows/material-model-recognition.yml'

permissions:
  contents: read

concurrency:
  group: material-model-recognition-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  recognition-windows:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CWS_HEADLESS_GUI_SMOKE: '1'
      CWS_RECOGNITION_EVIDENCE_DIR: ${{ github.workspace }}/build/material_model_recognition/recognition-screenshots
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 2
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify exact checked-out source
        id: identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) { throw "Source identity mismatch" }
          "source_sha=$actual" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - name: Create diagnostic evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/material_model_recognition | Out-Null
      - name: Install locked native runtime
        id: runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt *> build/material_model_recognition/dependency-install.log
          $installExit = $LASTEXITCODE
          Get-Content build/material_model_recognition/dependency-install.log
          if ($installExit -ne 0) { exit $installExit }
          python -m pip check *> build/material_model_recognition/pip-check.log
          $checkExit = $LASTEXITCODE
          Get-Content build/material_model_recognition/pip-check.log
          if ($checkExit -ne 0) { exit $checkExit }
      - name: Run exact-source strict acceptance
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/run_material_model_recognition_acceptance.py --require-native --output build/material_model_recognition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture actual BOM controls against the stored HVPC project
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/capture_bom_production_hub.py --project "validation/master_completion/hvpc_project/HVPC te Hengelo fasen totaal.cwscproj" --output build/material_model_recognition/bom-screenshots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload acceptance, dependency diagnostics and real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Material_Model_Recognition_${{ steps.identity.outputs.source_sha || github.sha }}_Windows_x64
          path: build/material_model_recognition/**
          if-no-files-found: error
          retention-days: 30
