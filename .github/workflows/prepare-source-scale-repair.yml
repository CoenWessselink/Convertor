name: Prepare reviewed source PDF scale repair
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-source-scale-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const b=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:'6789562c26133e708e63f184919053c273e45b96'})).data;
            const d=Buffer.from(b.content.replace(/\s/g,''),'base64');
            if(crypto.createHash('sha256').update(d).digest('hex')!=='9bbc8c9af05ffcab0a94df5db1f0e715743baf8d2bebbcd35b1ad88b9ec36422')throw new Error('Patch mismatch');
            fs.writeFileSync('/tmp/source-scale.patch',d);
      - name: Verify baseline and reviewed sources
        shell: python
        run: |
          import hashlib,json,pathlib,py_compile,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')=='1dfed35c0a016737b785535d218ba397e014714a','Branch moved; review required'
          p=pathlib.Path('/tmp/source-scale.patch')
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          expected={
            'docs/BOM_EXPORT_GAP_REPAIR_20260911.md':'f192291449a4912d50a352c482e2a69ca925faf8a2a48236f668ede5220f100c',
            'pdf_support.py':'dc27c626f87e25c844807c20c830174b88c3320fbd772076da2e58f6aceb9eb8',
            'review_workflow.py':'d83104fa6197780ce5b924d8cce3ae404b0c1c86ba5b08e19cb954a32083e491',
            'tests/pdf_export_brep_preview_smoke.py':'f6ac3207707e99385e859082f7a1d544a19e8491ec846740e117905eb412f5aa'
          }
          for name,digest in expected.items():
            p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
            if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/source-scale-files.json').write_text(json.dumps(expected))
      - name: Retain verified source blobs for explicit connected commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/source-scale-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data,tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const d=fs.readFileSync(path);if(crypto.createHash('sha256').update(d).digest('hex')!==hash)throw new Error(path);
              const b=(await github.rest.git.createBlob({...repo,content:d.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:b.sha});
            }
            tree.push({path:'.github/workflows/prepare-source-scale-repair.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'7e3948a6b113c0c05ce834046e139d1851285562',tree,files:expected,branch_updated:false,release_tests_passed:false};
            fs.mkdirSync('prepared',{recursive:true});fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_Source_Scale_Reviewed_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
