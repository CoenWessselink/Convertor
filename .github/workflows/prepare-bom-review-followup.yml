name: Prepare reviewed BOM review hardening
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/prepare-bom-review-followup.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retrieve verified patch and reviewed rebase delta
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const ids=['aded26c8d75302c07d03fb32d53b31776df5201c','967611015d6f7b44b39343ef71961ee4a0b90188','b17a0c6683dedcb78bb4e7548623dd72a566505d','b2d0e7a55cdabeef6e98376f161a4bae9aec172a','f88048d59c2d2a4e3de0c229d670d6258e5cb93a'];
            const chunks=[];
            for(const sha of ids){
              const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
              const data=Buffer.from(blob.content.replace(/\s/g,''),'base64');
              const actual=crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');
              if(actual!==sha)throw new Error('Transport mismatch '+sha);
              chunks.push(data);
            }
            fs.writeFileSync('/tmp/review-base.gz',Buffer.concat(chunks.slice(0,4)));
            fs.writeFileSync('/tmp/review-delta.gz',chunks[4]);
      - name: Verify current baseline, integrated patch and all resulting source bytes
        shell: python
        run: |
          import gzip,hashlib,json,pathlib,py_compile,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='61819aef157f2580ae4898521f1513ecb8bd60bd','Branch moved; review again, never overwrite'
          compressed=pathlib.Path('/tmp/review-base.gz').read_bytes()
          assert hashlib.sha256(compressed).hexdigest()=='344ac978a4b946cda0f550c7d9a7ba645c1ebbb702f12fe1cbb680268510ce15'
          original=gzip.decompress(compressed)
          assert hashlib.sha256(original).hexdigest()=='7611c4538ee50d908f0d98f36a206e9ab6192bf988d7e62b2391a825337ffe33'
          delta=pathlib.Path('/tmp/review-delta.gz').read_bytes()
          assert hashlib.sha256(delta).hexdigest()=='b4ef14368372d8bd3ddf0fba2be89b94f476c170d7cfe260e7c2c66a94a05bc5'
          lines=original.decode('utf-8').splitlines(keepends=True)
          operations=json.loads(gzip.decompress(delta))
          # Delta is transport data only: copy original line ranges or insert literal text.
          patch=''.join(''.join(lines[item[0]:item[1]]) if isinstance(item,list) else item for item in operations).encode('utf-8')
          assert hashlib.sha256(patch).hexdigest()=='869507c83a780e6fe8eda533dfc6acf574a1972d84ea1df85ca19599c8ebefde'
          path=pathlib.Path('/tmp/review-integrated.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          expected={
            'cws_convertor/bom/review_export.py':'848192d060624aebb8e59d4418c67155c6fcce3d1959fd74eb32acb224de4e76',
            'cws_convertor/bom/workspace.py':'4b44aa2aac72ff45c26fb091ef2644335f68a190ca23b9d95e1cf4b43af57c5b',
            'cws_convertor/ui_qt/bom_action_evidence.py':'2208e2560dc999d1f05d543a56488fde3e88e3deeb798eafaddd4ae94ec86597',
            'cws_convertor/ui_qt/bom_workspace.py':'dc0da404de56dbf716f7f92c112952a1f92cb94bc26b1d87d138a9755f51e110',
            'docs/BOM_REVIEW_EXPORT_REPAIR_20260911.md':'0974f82f51a59a593552490ab1350aa321f0b37203e8f316d2e9e507d067c669',
            'tests/bom_review_export_smoke.py':'a57239bc67767bfd973e675ecd8429f78dd72402e11a8daf55f73c856baeaba3',
            'tests/ui_v3_delivery_paths_smoke.py':'1534a46379cebd314ec6dfb155d2a3123570f65d85a90021ed09ffe493d336b2',
            'tools/build_tested_installer.py':'df55f42b4ffc788180573083f17ba118be26f068455ddb3a3ac4bc26d477de74',
            'tools/finalize_ui_v3_delivery.py':'84447d6e0e6f3a8dabf2b57f16dbeb9306bcc82d13ac18795fe05b62b9ed3591'
          }
          for name,digest in expected.items():
              p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
              if p.suffix=='.py':py_compile.compile(str(p),doraise=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/review-files.json').write_text(json.dumps(expected))
      - name: Store reviewed source objects without updating branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');const repo={owner:context.repo.owner,repo:context.repo.repo};
            const expected=JSON.parse(fs.readFileSync('/tmp/review-files.json','utf8'));
            const parent=(await github.rest.git.getCommit({...repo,commit_sha:context.sha})).data;
            const tree=[];
            for(const [path,hash] of Object.entries(expected)){
              const data=fs.readFileSync(path);
              if(crypto.createHash('sha256').update(data).digest('hex')!==hash)throw new Error(path);
              const blob=(await github.rest.git.createBlob({...repo,content:data.toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            tree.push({path:'.github/workflows/prepare-bom-review-followup.yml',mode:'100644',type:'blob',sha:null});
            const result={parent:context.sha,base_tree:parent.tree.sha,expected_final_tree:'5d993a41507b67b67b329127f0aa2e4ce5c349ba',tree,files:expected,branch_updated:false,release_tests_passed:false,scope:'Reviewed integrated source hashes/syntax only; full new Windows installed acceptance required.'};
            fs.mkdirSync('prepared',{recursive:true});fs.writeFileSync('prepared/PREPARED.json',JSON.stringify(result,null,2));
            console.log('REVIEWED_TREE='+JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_BOM_Review_Prepared_${{ github.sha }}
          path: prepared/PREPARED.json
          if-no-files-found: error
          retention-days: 30
