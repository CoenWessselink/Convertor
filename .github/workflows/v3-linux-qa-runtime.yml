name: V3 native QA runtime transport
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-linux-qa-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned native QA dependencies for isolated source verification
        run: python -m pip download --only-binary=:all: --dest qa-runtime PySide6==6.9.2 ifcopenshell==0.8.5
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Linux_QA_Runtime
          path: qa-runtime/*.whl
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
