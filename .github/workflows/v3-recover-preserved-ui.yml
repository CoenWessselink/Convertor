name: Recover preserved V3 UI patches for review only
on:
  push:
    branches: [agent/cws-pdf-ui-v3-complete-20260909]
    paths: ['.github/workflows/v3-recover-preserved-ui.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve previously uploaded Git objects without applying them
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');fs.mkdirSync('recovered',{recursive:true});
            const records=[];
            for(const sha of ['0f4d52c0e377e8140232381332fd242fb5725633','cf10fa19ffd96e3144a74285747e07665430ae76','423eb0fbd9a6fbf02c116b7aa56864a7ffad50b7']) {
              try {
                const blob=(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:sha})).data;
                const data=Buffer.from(blob.content.replace(/\s/g,''),'base64');
                fs.writeFileSync('recovered/'+sha+'.bin',data);
                records.push({sha,size:data.length,status:'RECOVERED_NOT_REVIEWED'});
              } catch(error) {records.push({sha,status:'UNAVAILABLE',error:String(error)});}
            }
            fs.writeFileSync('recovered/MANIFEST.json',JSON.stringify({source_commit:context.sha,records},null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: CWS_V3_Recovered_UI_Patches
          path: recovered/*
          retention-days: 14
          if-no-files-found: error
