name: Agent U4 integration source snapshot

on:
  push:
    branches:
      - agent/u4-integrated-exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full integration source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Create deterministic source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          root = Path.cwd()
          output = root / "CWS_Convertor_U4_INTEGRATION_SOURCE.zip"
          excluded_roots = {".git", ".venv", "build", "dist", "dist_installer", "__pycache__"}
          excluded_suffixes = {".pyc", ".pyo"}
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path == output:
                  continue
              rel = path.relative_to(root)
              if any(part in excluded_roots for part in rel.parts):
                  continue
              if path.suffix.lower() in excluded_suffixes:
                  continue
              files.append((path, rel.as_posix()))

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for source, name in files:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, source.read_bytes())

          manifest = {
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "file_count": len(files),
              "snapshot_sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
          }
          Path("CWS_Convertor_U4_INTEGRATION_SOURCE.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload integration source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cws-u4-integration-source
          path: |
            CWS_Convertor_U4_INTEGRATION_SOURCE.zip
            CWS_Convertor_U4_INTEGRATION_SOURCE.json
          if-no-files-found: error
          retention-days: 3
