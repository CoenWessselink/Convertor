name: CWS Viewer V15 T9 M6 nesting binding gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trimble-parity-v15
    paths:
      - 'cws_convertor/manufacturing/nesting_binding.py'
      - 'cws_convertor/manufacturing/nesting_binding_model.py'
      - 'cws_convertor/manufacturing/nesting_validation.py'
      - 'cws_convertor/manufacturing/__init__.py'
      - 'tests/viewer_v15_nesting_binding_smoke.py'
      - '.github/workflows/viewer-v15-t9-nesting-binding.yml'

permissions:
  contents: read

jobs:
  m6-nesting-binding-contract:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install standalone viewer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-viewer-standalone.lock.txt
          python -m pip check

      - name: Compile M6 modules
        shell: pwsh
        run: |
          python -m compileall -q cws_convertor/manufacturing/nesting_binding_model.py cws_convertor/manufacturing/nesting_binding.py cws_convertor/manufacturing/nesting_validation.py tests/viewer_v15_nesting_binding_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M6 compileall failed' }

      - name: Run M5 no-regression
        shell: pwsh
        run: |
          python tests/viewer_v15_machine_capability_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'M5 machine capability regression failed' }

      - name: Run deterministic M6 nesting binding contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation\viewer-v15-t9-m6 | Out-Null
          python tests/viewer_v15_nesting_binding_smoke.py 2>&1 | Tee-Object validation\viewer-v15-t9-m6\m6_nesting_binding.txt
          if ($LASTEXITCODE -ne 0) { throw 'M6 nesting binding contract failed' }

      - name: Upload M6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CWS_Viewer_V15_M6_nesting_binding_diagnostics
          path: validation/viewer-v15-t9-m6/*
          if-no-files-found: warn
          retention-days: 14
